  <script>
    // Plus de service worker depuis la v633.124 (ni le site, ni l'app Mac, ni l'app native n'en ont besoin).
    // Ce nettoyage désinscrit celui que les navigateurs avaient installé et vide son cache; à retirer avec
    // public/sw.js après quelques versions (voir CLAUDE.md).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
      if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
    }

<!-- ── Splash Screen ── -->
<div id="msMist"></div>
<div class="splash-overlay" id="splashScreen">
  <div class="splash-halo"></div>
  <div class="splash-logo-area" style="opacity:0">
    <img class="splash-flare" src="/imgProjet/splash-o.png" alt="" style="opacity:0" />
    <img class="splash-logo-img" src="/imgProjet/splash-typoMeteoshoot.png" alt="meteoshoot" />
  </div>
  <div class="splash-subtitle" style="opacity:0">Weather-based shooting planner</div>
  <div class="splash-version"><span class="splash-version-num">v633.148</span><span class="splash-version-by">BY DRIFT&amp;GRAIN</span></div>
</div>
<script>
  // Séquence d'ouverture: le splash reste au moins 2 s (logo et halo animés). Quand l'interface est prête,
  // le rond turquoise derrière « shoot » (le flare, déjà animé) grandit, doucement puis de plus en plus
  // vite jusqu'à une fin explosive (0,5 s),
  // jusqu'à sortir de l'écran; pendant ce temps le reste du splash (typo, sous-titre, version, halo) s'efface
  // et l'interface, retenue jusque-là par #root.ms-hold, se met en place sous le voile sombre. Ensuite le
  // voile se dissout (0,3 s) sur l'interface déjà en place. Filet de sécurité à 6 s. Le flare est ensuite
  // conservé hors du splash pour l'effet de la liste.
  (function () {
    var done = false, ready = false, minElapsed = false, revealed = false, growAnim = null;
    var MIN_SPLASH_MS = 2000, GROW_MS = 500, GROW_K = 10;
    // L'interface se met en place (animations d'entrée libérées), encore cachée par le voile.
    function release() {
      var root = document.getElementById('root');
      if (root && root.classList.contains('ms-hold')) {
        root.classList.remove('ms-hold');
        try { window.dispatchEvent(new Event('meteoshoot:reveal')); } catch (e) {}
      }
    }
    // Le voile sombre se dissout sur l'interface.
    function reveal() {
      if (revealed) return;
      revealed = true;
      release();
      var splash = document.getElementById('splashScreen');
      var mist = document.getElementById('msMist');
      if (mist) { mist.classList.add('lifted'); setTimeout(function() { mist.remove(); }, 1800); }
      if (!splash) return;
      if (growAnim) { try { growAnim.cancel(); } catch (e) {} growAnim = null; }
      var flare = document.querySelector('.splash-flare');
      if (flare) {
        flare.id = 'persistentFlare';
        var rect = flare.getBoundingClientRect();
        flare.dataset.splashWidth = rect.width + 'px';
        flare.style.position = 'fixed';
        flare.style.zIndex = '30';
        flare.style.pointerEvents = 'none';
        flare.style.mixBlendMode = 'color-dodge';
        flare.style.opacity = '0';
        flare.style.width = rect.width + 'px';
        flare.style.transform = 'none';
        flare.style.animation = 'none';
        flare.style.transition = 'opacity 1s ease';
        document.body.appendChild(flare);
      }
      splash.classList.add('splash-hidden');
      document.getElementById('themeColor').setAttribute('content', '#181b1e');
      setTimeout(function() { splash.remove(); }, 600);
    }
    // Le flare grandit depuis sa position: échelle finale calculée pour que le bord intérieur de son anneau
    // (12 % de sa largeur) dépasse le coin d'écran le plus éloigné; progression exponentielle
    // (e^(K·t) - 1) / (e^K - 1), K = 10 (forme dessinée par Stéphane, raidie à sa demande): le rond grossit
    // à peine les deux premiers tiers, puis passe de 2 à 24 fois sa taille dans le dernier tiers (0,15 s).
    // Le reste du splash s'efface quand le rond le traverse (classe splash-grow, voir app.css).
    function grow() {
      var splash = document.getElementById('splashScreen');
      var flare = splash && splash.querySelector('.splash-flare');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!splash || !flare || !flare.animate || reduce) { reveal(); return; }
      release();
      var r = flare.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var far = Math.sqrt(Math.pow(Math.max(cx, window.innerWidth - cx), 2) + Math.pow(Math.max(cy, window.innerHeight - cy), 2));
      var end = Math.max(8, (far * 1.1) / (0.12 * r.width));
      splash.classList.add('splash-grow');
      // Le grossissement se compose par-dessus le flottement du rond (composite « add »): aucun à-coup au
      // départ, le rond continue de flotter en grandissant. Sans ce mode (vieux navigateurs), on remplace la
      // transformation entière, en reprenant le décalage horizontal du rond (variable CSS --flare-dx).
      var additive = false;
      try { additive = typeof KeyframeEffect !== 'undefined' && ('composite' in KeyframeEffect.prototype); } catch (e) {}
      var dx = (getComputedStyle(flare).getPropertyValue('--flare-dx') || '50px').trim() || '50px';
      var frames = [];
      for (var i = 0; i <= 40; i++) {
        var t = i / 40, p = (Math.exp(GROW_K * t) - 1) / (Math.exp(GROW_K) - 1);
        var sc = 'scale(' + (1 + (end - 1) * p).toFixed(3) + ')';
        frames.push({ transform: additive ? sc : 'translate(calc(-50% + ' + dx + '), -50%) ' + sc });
      }
      var opts = { duration: GROW_MS, easing: 'linear', fill: 'forwards' };
      if (additive) opts.composite = 'add';
      growAnim = flare.animate(frames, opts);
      growAnim.onfinish = reveal;
      setTimeout(reveal, GROW_MS + 150);
    }
    function hideSplash() {
      if (done) return;
      done = true;
      grow();
    }
    function maybeHide() { if (ready && minElapsed) hideSplash(); }
    window.__meteoshootReady = function () { ready = true; maybeHide(); };
    setTimeout(function () { minElapsed = true; maybeHide(); }, MIN_SPLASH_MS);
    setTimeout(hideSplash, 6000);
  })();
</script>
<script>
  // Drag-to-scroll with momentum, bounce & motion blur for .hour-scroll containers
  document.addEventListener('mousedown', function(e) {
    const el = e.target.closest('.hour-scroll');
    if (!el) return;
    let startX = e.pageX, scrollLeft = el.scrollLeft, moved = false;
    let lastX = e.pageX, lastT = Date.now(), velocity = 0;
    let rafId = null;
    el.classList.add('dragging');
    el.style.scrollBehavior = 'auto';

    const onMove = (ev) => {
      const dx = ev.pageX - startX;
      if (Math.abs(dx) > 3) moved = true;
      const now = Date.now();
      const dt = now - lastT;
      if (dt > 0) velocity = (ev.pageX - lastX) / dt;
      lastX = ev.pageX; lastT = now;
      el.scrollLeft = scrollLeft - dx;
    };

    const onUp = () => {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      let v = velocity * 16;
      const decel = 0.95;
      const maxScroll = el.scrollWidth - el.clientWidth;

      const glide = () => {
        if (Math.abs(v) < 0.5) { doBounce(); return; }
        const before = el.scrollLeft;
        el.scrollLeft -= v;
        const after = el.scrollLeft;
        if (before === after && Math.abs(v) > 2) { doBounce(); return; }
        v *= decel;
        rafId = requestAnimationFrame(glide);
      };

      const doBounce = () => {
        const atStart = el.scrollLeft <= 0;
        const atEnd = el.scrollLeft >= maxScroll - 1;
        if ((atStart || atEnd) && Math.abs(velocity) > 0.1) {
          const dir = atStart ? 1 : -1;
          const bump = Math.min(Math.abs(velocity) * 80, 30);
          el.style.transition = 'transform 0.15s cubic-bezier(0.2, 0, 0.4, 1)';
          el.style.transform = 'translateX(' + (dir * bump) + 'px)';
          setTimeout(() => {
            el.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
            el.style.transform = '';
            setTimeout(() => { el.style.transition = ''; }, 500);
          }, 150);
        }
      };

      glide();
      const stopMomentum = () => {
        if (rafId) cancelAnimationFrame(rafId);
        el.removeEventListener('mousedown', stopMomentum);
      };
      el.addEventListener('mousedown', stopMomentum, { once: true });
      if (moved) {
        const block = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
        el.addEventListener('click', block, { capture: true, once: true });
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
</script>
