<script>
  // Drag-to-scroll for .hour-scroll containers
  document.addEventListener('mousedown', function(e) {
    const el = e.target.closest('.hour-scroll');
    if (!el) return;
    let startX = e.pageX, scrollLeft = el.scrollLeft, moved = false;
    el.classList.add('dragging');
    const onMove = (ev) => {
      const dx = ev.pageX - startX;
      if (Math.abs(dx) > 3) moved = true;
      el.scrollLeft = scrollLeft - dx;
    };
    const onUp = () => {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (moved) {
        // Block click events that fire after drag
        const block = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
        el.addEventListener('click', block, { capture: true, once: true });
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
</script>

    // ===== CONSTANTS =====
    const MandateType = { INT: 'INT', EXT: 'EXT', DRONE: 'DRONE', DRONE_C: 'DRONE+C', VID: 'VID' };
    const ProjectStatus = { TODO: 'todo', RETOUCHING: 'retouching', DONE: 'done' };

    // ===== UTILS =====
    const generateId = () => `p_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
    const toggleMandate = (current, m) => {
      if (current?.includes(m)) return current.filter(x => x !== m);
      let next = [...(current || []), m];
      // DRONE et DRONE+C sont mutuellement exclusifs
      if (m === 'DRONE') next = next.filter(x => x !== 'DRONE+C');
      if (m === 'DRONE+C') next = next.filter(x => x !== 'DRONE');
      return next;
    };
    const formatDateShort = (d) => { const date = new Date(d); return `${date.getDate()} ${['JAN','FÉV','MAR','AVR','MAI','JUIN','JUIL','AOÛT','SEP','OCT','NOV','DÉC'][date.getMonth()]} ${date.getFullYear()}`; };
    const daysSince = (d) => Math.floor((new Date() - new Date(d)) / (1000 * 60 * 60 * 24));
    const getDayAbbrev = (d) => ['DIM.','LUN.','MAR.','MER.','JEU.','VEN.','SAM.'][(typeof d === 'string' ? new Date(d + 'T00:00:00') : d).getDay()];
    const getDayMonth = (d) => { const date = typeof d === 'string' ? new Date(d + 'T00:00:00') : d; return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}`; };
    const isToday = (d) => (typeof d === 'string' ? new Date(d + 'T00:00:00') : d).toDateString() === new Date().toDateString();
    const isWeekend = (d) => [0,6].includes(new Date(d).getDay());
    const formatTime = (iso) => { if (!iso) return '--:--'; const d = new Date(iso); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
    const formatDuration = (s) => { if (!s) return '—'; return `${String(Math.floor(s/3600)).padStart(2,'0')}H${String(Math.floor((s%3600)/60)).padStart(2,'0')}`; };
    const calcWakeUp = (sunrise, travel, prep=60) => { if (!sunrise || !travel) return null; return new Date(new Date(sunrise).getTime() - travel*1000 - prep*60*1000).toISOString(); };
    const weatherCodeIcon = { 
      0:'sunny', 1:'sunny', 2:'partly-cloudy', 3:'cloudy',  // 0-1=dégagé, 2=partiellement nuageux, 3=couvert
      45:'cloudy', 48:'cloudy',  // brouillard
      51:'rain', 53:'rain', 55:'rain',  // bruine
      56:'rain', 57:'rain',  // bruine verglaçante
      61:'rain', 63:'rain', 65:'rain',  // pluie
      66:'rain', 67:'rain',  // pluie verglaçante
      71:'snow', 73:'snow', 75:'snow',  // neige
      77:'snow',  // grains de neige
      80:'rain', 81:'rain', 82:'rain',  // averses
      85:'snow', 86:'snow',  // averses de neige
      95:'thunderstorm', 96:'thunderstorm', 99:'thunderstorm'  // orages
    };
    const isGoodWeather = (c) => [0,1,2].includes(c);  // 0=dégagé, 1=principalement dégagé, 2=partiellement nuageux

    // ===== GOOGLE MAPS API =====
    const GOOGLE_API_KEY = 'AIzaSyCgOyu05taIWv2-LcfHM_B8okQ_D7gks8U';

    
    const geocodeAddress = (address) => {
      return new Promise((resolve, reject) => {
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({ address, region: 'ca' }, (results, status) => {
          if (status === 'OK' && results[0]) {
            const loc = results[0].geometry.location;
            resolve({
              lat: loc.lat(),
              lng: loc.lng(),
              formattedAddress: results[0].formatted_address
            });
          } else {
            reject(new Error('Adresse non trouvée'));
          }
        });
      });
    };

    const getTravelTime = (originLat, originLng, destLat, destLng) => {
      return new Promise((resolve, reject) => {
        const service = new google.maps.DistanceMatrixService();
        service.getDistanceMatrix({
          origins: [{ lat: originLat, lng: originLng }],
          destinations: [{ lat: destLat, lng: destLng }],
          travelMode: 'DRIVING',
          drivingOptions: { departureTime: new Date(Date.now() + 86400000) } // Tomorrow
        }, (response, status) => {
          if (status === 'OK' && response.rows[0]?.elements[0]?.status === 'OK') {
            const element = response.rows[0].elements[0];
            resolve({
              durationSeconds: element.duration.value,
              durationText: element.duration.text,
              distanceMeters: element.distance.value,
              distanceText: element.distance.text
            });
          } else {
            // Fallback: calculate straight line with estimate
            const R = 6371;
            const dLat = (destLat - originLat) * Math.PI / 180;
            const dLon = (destLng - originLng) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(originLat * Math.PI / 180) * Math.cos(destLat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;
            const durationSeconds = Math.round((distance / 80) * 3600); // ~80km/h average
            resolve({ durationSeconds, durationText: formatDuration(durationSeconds), distanceMeters: distance * 1000, distanceText: `${Math.round(distance)} km` });
          }
        });
      });
    };

    // ===== WEATHER API =====
    const fetchWeather = async (lat, lng) => {
      const url = `https://api.open-meteo.com/v1/gem?latitude=${lat}&longitude=${lng}&hourly=temperature_2m,weathercode,windspeed_10m,cloudcover,precipitation&daily=weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=America/Toronto&forecast_days=10`;
      const res = await fetch(url);
      const data = await res.json();
      
      // Calculer stats journalières depuis les données horaires (6h-18h)
      const getDailyStats = (dateStr) => {
        const dayStart = new Date(dateStr + 'T06:00:00');
        const dayEnd = new Date(dateStr + 'T18:00:00');
        
        let totalCloud = 0, cloudCount = 0, count = 0, precipCount = 0;
        let hasThunderstorm = false, hasSnow = false, hasRain = false;
        
        data.hourly.time.forEach((t, i) => {
          const time = new Date(t);
          if (time >= dayStart && time <= dayEnd) {
            count++;
            if (data.hourly.cloudcover[i] != null) {
              totalCloud += data.hourly.cloudcover[i];
              cloudCount++;
            }
            const wc = data.hourly.weathercode[i];
            if (wc >= 51) { // Any precipitation code
              precipCount++;
              if (wc >= 95) hasThunderstorm = true;
              else if ((wc >= 71 && wc <= 77) || wc === 85 || wc === 86) hasSnow = true;
              else hasRain = true;
            }
          }
        });
        
        const cloudcover = cloudCount > 0 ? Math.round(totalCloud / cloudCount) : null;
        // Only show precip icon if >= 40% of daytime hours have precipitation
        const precipRatio = count > 0 ? precipCount / count : 0;
        let icon = null;
        if (precipRatio >= 0.4) {
          icon = hasThunderstorm ? 'thunderstorm' : hasSnow ? 'snow' : hasRain ? 'rain' : null;
        }
        return { cloudcover, icon };
      };
      
      return {
        hourly: data.hourly.time.map((t,i) => ({ time: t, temp: Math.round(data.hourly.temperature_2m[i]), wind: Math.round(data.hourly.windspeed_10m[i]), cloudcover: data.hourly.cloudcover[i], precip: data.hourly.precipitation?.[i] ?? 0, icon: weatherCodeIcon[data.hourly.weathercode[i]] || 'cloudy', isGood: isGoodWeather(data.hourly.weathercode[i]) })),
        daily: data.daily.time.map((t,i) => {
          const stats = getDailyStats(t);
          // Use hourly-derived icon when available, fallback to daily weathercode
          const icon = stats.icon || (stats.cloudcover !== null ? null : (weatherCodeIcon[data.daily.weathercode[i]] || 'cloudy'));
          return { date: t, high: Math.round(data.daily.temperature_2m_max[i]), low: Math.round(data.daily.temperature_2m_min[i]), cloudcover: stats.cloudcover, icon, sunrise: data.daily.sunrise[i], sunset: data.daily.sunset[i], isGood: isGoodWeather(data.daily.weathercode[i]) };
        })
      };
    };

    // ===== STORE =====
    const StoreContext = createContext();
    const useStore = () => useContext(StoreContext);
    
    const StoreProvider = ({ children }) => {

      const [prefs, setPrefsState] = useState(() => JSON.parse(localStorage.getItem('sp-prefs') || '{"homeAddress":"","homeLat":null,"homeLng":null,"prepTime":60}'));
      const [view, setView] = useState('todo');

      // On login: load from Supabase or migrate localStorage

            const hasDbData = dbProjects && dbProjects.length > 0;

          }

        syncData();
      }, [user]);

      // Realtime subscription — sync across devices
      useEffect(() => {
        if (!user || !synced) return;
        const channel = supabase.channel('projects-realtime')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'projects', filter: `user_id=eq.${user.id}` }, (payload) => {
            if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
              const p = payload.new;
              const mapped = {
                id: p.id, name: p.name, address: p.address, lat: p.lat, lng: p.lng,
                status: p.status, mandates: p.mandates || [], orientation: p.orientation || [],

              setProjects(prev => {

                if (exists >= 0) { const next = [...prev]; next[exists] = mapped; return next; }

            } else if (payload.eventType === 'DELETE') {

        return () => supabase.removeChannel(channel);

        setProjects(p => [proj, ...p]);

        return proj.id;

      const updateProject = (id, upd) => {
        setProjects(p => p.map(x => x.id === id ? {...x, ...upd} : x));
        if (user) {
          // Map camelCase to snake_case

          if ('orientation' in upd) dbUpd.orientation = upd.orientation;
          if ('isContest' in upd) dbUpd.is_contest = upd.isContest;
          if ('notes' in upd) dbUpd.notes = upd.notes;

          if ('departureAddress' in upd) dbUpd.departure_address = upd.departureAddress;
          if ('departureLat' in upd) dbUpd.departure_lat = upd.departureLat;
          if ('departureLng' in upd) dbUpd.departure_lng = upd.departureLng;
          if ('travelTime' in upd) dbUpd.travel_time = upd.travelTime;
          if ('shotAt' in upd) dbUpd.shot_at = upd.shotAt;
          if ('completedAt' in upd) dbUpd.completed_at = upd.completedAt;
          if (Object.keys(dbUpd).length > 0) {

              .then(({ error }) => { if (error) console.error('Update error:', error); });

      const deleteProject = (id) => {

          const upd = { status: ProjectStatus.RETOUCHING, shotAt: new Date().toISOString() };

          const upd = { status: ProjectStatus.TODO, shotAt: null };
          if (user) supabase.from(TBL_PROJECTS).update({ status: upd.status, shot_at: null }).eq('id', id);
          return {...x, ...upd};
        }
        return x;

      const reorderProjects = (dragId, dropId) => {
        setProjects(p => {
          const dragIndex = p.findIndex(x => x.id === dragId);

          const newProjects = [...p];

    const StarIcon = () => <svg className="w-4 h-4" viewBox="0 0 24 24" fill="#ffe26b"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>;

    </svg>;
    const PlusIcon = () => <svg className="w-6 h-6" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;

    const MenuIcon = () => <svg className="w-6 h-6" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>;
    const UndoIcon = () => <svg className="w-5 h-5" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none"><path d="M3 10h10a5 5 0 0 1 5 5v2"/><polyline points="3,10 7,6"/><polyline points="3,10 7,14"/></svg>;

    // ===== COMPONENTS =====

    // Global tracker for active weather tooltip
    let activeWeatherRowDismiss = null;

    const WeatherRow = ({ daily, hourly, onDayClick, maxDays = 9 }) => {
      const [hoveredIdx, setHoveredIdx] = useState(null);
      const [mouseX, setMouseX] = useState(0);
      const [cellCenterX, setCellCenterX] = useState(0);
      const [displayX, setDisplayX] = useState(0);
      const [visible, setVisible] = useState(false);
      const rowRef = React.useRef(null);
      const hideTimer = React.useRef(null);
      const targetX = React.useRef(0);
      const currentX = React.useRef(0);
      const rafRef = React.useRef(null);
      const isMobile = useIsMobile();

      // Close tooltip on scroll/wheel (desktop)
      useEffect(() => {
        if (isMobile) return;
        const dismiss = () => { setVisible(false); setHoveredIdx(null); };
        window.addEventListener('scroll', dismiss, true);
        window.addEventListener('wheel', dismiss, { passive: true });
        return () => { window.removeEventListener('scroll', dismiss, true); window.removeEventListener('wheel', dismiss); };
      }, [isMobile]);

      // Lerp animation loop (desktop only)
      useEffect(() => {
        if (isMobile) return;
        const animate = () => {
          const diff = targetX.current - currentX.current;
          currentX.current += diff * 0.15;
          if (Math.abs(diff) > 0.3) {
            setDisplayX(currentX.current);
          }
          rafRef.current = requestAnimationFrame(animate);
        };
        rafRef.current = requestAnimationFrame(animate);
        return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
      }, [isMobile]);
      
      if (!daily?.length) return <div className="flex gap-2 py-2">{[...Array(10)].map((_,i) => <div key={i} className="flex flex-col items-center gap-0 min-w-[56px]"><div className="w-12 h-4 bg-cream-dark rounded animate-pulse"/><div className="w-8 h-8 bg-cream-dark rounded-full animate-pulse"/></div>)}</div>;
      
      const todayIndex = daily.findIndex(d => isToday(d.date));
      const startIndex = todayIndex >= 0 ? todayIndex : 0;
      const sortedDaily = daily.slice(startIndex, startIndex + maxDays);
      
      const getIconFromCloudcover = (cloudcover, originalIcon) => {
        // Precipitation from hourly data takes priority
        if (originalIcon === 'thunderstorm') return 'thunderstorm';
        if (originalIcon === 'snow') return 'snow';
        if (originalIcon === 'rain') return 'rain';
        
        // No hourly data at all? Use daily weathercode icon
        if (cloudcover === null || cloudcover === undefined) {
          if (originalIcon === 'sunny') return 'sunny';
          if (originalIcon === 'partly-cloudy') return 'partly-cloudy';
          return originalIcon || 'cloudy';
        }
        
        // Use cloudcover for sun/cloud level (hourly data available)
        if (cloudcover <= 10) return 'sunny-bright';
        if (cloudcover <= 20) return 'sunny';
        if (cloudcover <= 30) return 'sunny-few-clouds';
        if (cloudcover <= 40) return 'mostly-sunny';
        if (cloudcover <= 55) return 'partly-cloudy';
        if (cloudcover <= 70) return 'mostly-cloudy';
        if (cloudcover <= 85) return 'cloudy-glimpse';
        return 'cloudy';
      };

      const handleRowMouseMove = (e) => {
        if (window.__isDragging) return;
        if (!rowRef.current) return;
        const rect = rowRef.current.getBoundingClientRect();
        setMouseX(e.clientX - rect.left);
      };

      const handleCellEnter = (i, e) => {
        if (window.__isDragging) return;
        // Dismiss any other row's tooltip first
        if (activeWeatherRowDismiss && activeWeatherRowDismiss !== dismiss) {
          activeWeatherRowDismiss();
        }
        activeWeatherRowDismiss = dismiss;
        if (hideTimer.current) { clearTimeout(hideTimer.current); hideTimer.current = null; }
        const cellRect = e.currentTarget.getBoundingClientRect();
        const rowRect = rowRef.current.getBoundingClientRect();
        const cx = cellRect.left + cellRect.width / 2 - rowRect.left;
        if (hoveredIdx === null) { currentX.current = cx; setDisplayX(cx); }
        targetX.current = cx;
        setCellCenterX(cx);
        setHoveredIdx(i);
        setVisible(true);
      };

      const dismiss = () => {
        clearTimeout(hideTimer.current);
        setVisible(false);
        setHoveredIdx(null);
      };

      const handleRowLeave = () => {
        dismiss();
        if (activeWeatherRowDismiss === dismiss) activeWeatherRowDismiss = null;
      };

      const hoveredDay = hoveredIdx !== null ? sortedDaily[hoveredIdx] : null;
      
      return (
        <div 
          className="relative" 
          ref={rowRef}
          onMouseMove={isMobile ? undefined : handleRowMouseMove}
          onMouseLeave={isMobile ? undefined : handleRowLeave}
        >
          <div className="flex gap-0 py-0" style={{ overflow: 'visible' }}>
          {sortedDaily.map((day, i) => {
            const icon = getIconFromCloudcover(day.cloudcover, day.icon);
            const hasPrecip = ['rain', 'snow', 'thunderstorm'].includes(day.icon);
            const isGood = hasPrecip ? false : (day.cloudcover !== null ? day.cloudcover <= 50 : day.isGood);
            const isSunny = hasPrecip ? false : (day.cloudcover !== null ? day.cloudcover <= 20 : ['sunny'].includes(day.icon));
            return (
              <div 
                key={day.date} 
                className={`day-cell relative flex flex-col items-center gap-0 min-w-[48px] px-0 py-0 rounded cursor-pointer ${i===0 ? 'bg-cream-dark/50' : ''}`}
                onClick={() => onDayClick?.()}
                onMouseEnter={isMobile ? undefined : (e) => handleCellEnter(i, e)}
              >
                {isSunny && <div style={{ position: 'absolute', bottom: 0, left: '50%', transform: 'translateX(-50%) translateY(95%) scaleX(0.6) scaleY(1.4)', width: '60px', height: '60px', pointerEvents: 'none', zIndex: 0, borderRadius: '50%', background: 'radial-gradient(circle, rgba(255,226,107,0.3) 0%, rgba(255,226,107,0.1) 40%, transparent 70%)', animation: 'sunglowPulse 6s ease-in-out infinite' }}/>}
                <span className={`font-bebas-bold text-sm leading-none ${isGood ? '' : 'line-through'}`} style={{ color: isGood ? '#8B9B99' : '#404A48' }}>
                  {isToday(day.date) ? 'CE JOUR' : getDayAbbrev(day.date)}
                </span>
                <span className="font-bebas-bold text-xs leading-none" style={{ color: isGood ? '#8B9B99' : '#404A48' }}>{getDayMonth(day.date)}</span>
                <WeatherIcon type={icon} className={`w-8 h-8 ${!isGood ? 'opacity-50' : ''}`}/>
                <span className="font-bebas-bold text-sm leading-none text-charcoal-muted" style={{ marginTop: '4px' }}>
                  {day.cloudcover !== null ? `${day.cloudcover}%` : '--'}
                </span>
              </div>
            );
          })}
          </div>
          {!isMobile && hoveredDay && ReactDOM.createPortal(
            <div 
              className="whitespace-nowrap px-3 py-2"
              style={{ 
                position: 'fixed',
                zIndex: 9999,
                top: rowRef.current ? rowRef.current.getBoundingClientRect().bottom + 12 : 0, 
                left: rowRef.current ? rowRef.current.getBoundingClientRect().left + displayX : 0, 
                transform: 'translateX(-50%)', 
                backgroundColor: 'var(--bg-primary)', 
                border: '1px solid var(--text-muted)', 
                boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
                pointerEvents: 'none',
                opacity: visible ? 1 : 0,
                transition: 'opacity 0.25s ease'
              }}
            >
              <div className="absolute -top-2 w-0 h-0" style={{ left: `calc(50% + ${cellCenterX - displayX}px)`, transform: 'translateX(-50%)', borderLeft: '8px solid transparent', borderRight: '8px solid transparent', borderBottom: '8px solid var(--text-muted)' }}/>
              <div className="flex gap-2">
                <DayPeriodIcon label="LEVER" icon="sunrise" day={hoveredDay} hourly={hourly} sunriseHour={hoveredDay.sunrise ? new Date(hoveredDay.sunrise).getHours() : 6} sunsetHour={hoveredDay.sunset ? new Date(hoveredDay.sunset).getHours() : 20}/>
                <DayPeriodIcon label="AM" day={hoveredDay} hourly={hourly} sunriseHour={hoveredDay.sunrise ? new Date(hoveredDay.sunrise).getHours() : 6} sunsetHour={hoveredDay.sunset ? new Date(hoveredDay.sunset).getHours() : 20}/>
                <DayPeriodIcon label="PM" day={hoveredDay} hourly={hourly} sunriseHour={hoveredDay.sunrise ? new Date(hoveredDay.sunrise).getHours() : 6} sunsetHour={hoveredDay.sunset ? new Date(hoveredDay.sunset).getHours() : 20}/>
                <DayPeriodIcon label="COUCHER" icon="sunset" day={hoveredDay} hourly={hourly} sunriseHour={hoveredDay.sunrise ? new Date(hoveredDay.sunrise).getHours() : 6} sunsetHour={hoveredDay.sunset ? new Date(hoveredDay.sunset).getHours() : 20}/>
              </div>
            </div>,
            document.body
          )}
        </div>
      );
    };
    
    const DayPeriodIcon = ({ label, icon, day, hourly, sunriseHour, sunsetHour }) => {
      const getIconFromCloudAndPrecip = (cloudcover, dominantIcon) => {
        if (dominantIcon === 'thunderstorm') return 'thunderstorm';
        if (dominantIcon === 'snow') return 'snow';
        if (dominantIcon === 'rain') return 'rain';
        if (cloudcover <= 10) return 'sunny-bright';
        if (cloudcover <= 20) return 'sunny';
        if (cloudcover <= 30) return 'sunny-few-clouds';
        if (cloudcover <= 40) return 'mostly-sunny';
        if (cloudcover <= 55) return 'partly-cloudy';
        if (cloudcover <= 70) return 'mostly-cloudy';
        if (cloudcover <= 85) return 'cloudy-glimpse';
        return 'cloudy';
      };
      
      // Calculer les heures de début/fin selon la période
      let startHour, endHour;
      if (label === 'LEVER') {
        startHour = sunriseHour - 1;
        endHour = sunriseHour + 1;
      } else if (label === 'AM') {
        startHour = 8;
        endHour = 11;
      } else if (label === 'PM') {
        startHour = 13;
        endHour = 16;
      } else if (label === 'COUCHER') {
        startHour = sunsetHour - 1;
        endHour = sunsetHour + 1;
      }
      
      const dayDate = new Date(day.date + 'T00:00:00');
      let avgCloud = null;
      let dominantIcon = null;
      
      if (hourly?.length) {
        const periodData = hourly.filter(h => {
          const hDate = new Date(h.time);
          const hHour = hDate.getHours();
          return hDate.toDateString() === dayDate.toDateString() && hHour >= startHour && hHour < endHour;
        });
        if (periodData.length) {
          // Only use hours with actual cloudcover data
          const withCloud = periodData.filter(h => h.cloudcover != null);
          if (withCloud.length) {
            avgCloud = Math.round(withCloud.reduce((a, b) => a + b.cloudcover, 0) / withCloud.length);
          } else {
            // Fallback to daily cloudcover
            avgCloud = day.cloudcover;
          }
          // Find dominant precipitation type
          const precipIcons = periodData.map(h => h.icon).filter(i => ['thunderstorm', 'rain', 'snow'].includes(i));
          if (precipIcons.length > 0) {
            if (precipIcons.includes('thunderstorm')) dominantIcon = 'thunderstorm';
            else if (precipIcons.includes('snow')) dominantIcon = 'snow';
            else if (precipIcons.includes('rain')) dominantIcon = 'rain';
          }
        } else {
          // No hourly data for this period — fallback to daily
          avgCloud = day.cloudcover;
        }
      } else {
        avgCloud = day.cloudcover;
      }
      
      return (
        <div className="flex flex-col items-center">
          {icon === 'sunrise' ? (
            <span className="font-bebas-bold text-xl" style={{ color: '#5E6C6A', height: '32px', display: 'flex', alignItems: 'center' }}>{day.sunrise ? formatTime(day.sunrise) : '--:--'}</span>
          ) : icon === 'sunset' ? (
            <span className="font-bebas-bold text-xl" style={{ color: '#5E6C6A', height: '32px', display: 'flex', alignItems: 'center' }}>{day.sunset ? formatTime(day.sunset) : '--:--'}</span>
          ) : (
            <span className="font-bebas-bold text-xl" style={{ color: '#5E6C6A', height: '32px', display: 'flex', alignItems: 'center' }}>{label}</span>
          )}
          {avgCloud !== null ? (
            <>
              <WeatherIcon type={getIconFromCloudAndPrecip(avgCloud, dominantIcon)} className="w-8 h-8"/>
              <span className="font-bebas-bold text-sm text-charcoal-muted">{avgCloud}%</span>
            </>
          ) : (
            <span className="text-charcoal-muted text-sm">--</span>
          )}
        </div>
      );
    };

    const HourlyWeather = ({ hourly, sunrise, sunset }) => {
      if (!hourly?.length) return <div className="flex gap-3 py-4">{[...Array(12)].map((_,i) => <div key={i} className="flex flex-col items-center gap-2 min-w-[44px]"><div className="w-6 h-3 bg-cream-dark rounded animate-pulse"/><div className="w-6 h-6 bg-cream-dark rounded-full animate-pulse"/><div className="w-6 h-3 bg-cream-dark rounded animate-pulse"/></div>)}</div>;
      const sunriseH = sunrise ? new Date(sunrise).getHours() : null;
      const sunsetH = sunset ? new Date(sunset).getHours() : null;
      const now = new Date();
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
      const filtered = hourly.filter(h => new Date(h.time) >= oneHourAgo).slice(0, 24);
      
      const getIconForHour = (h, isNight) => {
        const cc = h.cloudcover != null ? h.cloudcover : null;
        const origIcon = h.icon;
        if (origIcon === 'thunderstorm') return 'thunderstorm';
        if (origIcon === 'snow') return 'snow';
        if (origIcon === 'rain') return 'rain';
        if (cc === null) return origIcon || 'cloudy';
        if (isNight) {
          if (cc <= 10) return 'moon-bright'; if (cc <= 20) return 'moon';
          if (cc <= 30) return 'moon-few-clouds'; if (cc <= 40) return 'moon-mostly-clear';
          if (cc <= 55) return 'moon-partly-cloudy'; if (cc <= 70) return 'moon-mostly-cloudy';
          if (cc <= 85) return 'moon-cloudy-glimpse'; return 'moon-cloudy';
        }
        if (cc <= 10) return 'sunny-bright'; if (cc <= 20) return 'sunny';
        if (cc <= 30) return 'sunny-few-clouds'; if (cc <= 40) return 'mostly-sunny';
        if (cc <= 55) return 'partly-cloudy'; if (cc <= 70) return 'mostly-cloudy';
        if (cc <= 85) return 'cloudy-glimpse'; return 'cloudy';
      };
      
      return (
        <div className="relative">
          <div className="flex gap-2 py-4 overflow-x-auto hour-scroll">
            {filtered.map(h => {
              const hr = new Date(h.time).getHours();
              const isSunrise = sunriseH === hr;
              const isSunset = sunsetH === hr;
              const isNight = sunriseH && sunsetH && (hr < sunriseH || hr >= sunsetH);
              const icon = getIconForHour(h, isNight);
              return (
                <div key={h.time} className={`flex flex-col items-center gap-1 min-w-[44px] px-1 py-2 rounded ${isNight ? 'bg-charcoal/5' : ''}`}>
                  <span className={`font-bebas-bold text-xs ${isSunrise || isSunset ? 'text-orange font-bold' : 'text-charcoal-muted'}`}>
                    {isSunrise ? formatTime(sunrise).replace(':','H') : isSunset ? formatTime(sunset).replace(':','H') : `${hr}H`}
                  </span>
                  <WeatherIcon type={icon} className={`w-5 h-5 ${isNight ? 'opacity-60' : ''}`}/>
                  <span className={`text-sm font-medium ${h.temp <= 0 ? 'text-blue-500' : h.temp >= 25 ? 'text-red-500' : 'text-charcoal'}`} style={{ marginTop: '3px' }}>{h.temp}°</span>
                  <span className="text-[10px] text-charcoal-muted">{h.wind} <span className="text-[8px]">KM/H</span></span>
                </div>
              );
            })}
          </div>
          <div className="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-cream to-transparent pointer-events-none"/>
        </div>
      );
    };

    const ProjectCard = ({ project, index = 0, onSelect, onMouseDownDrag, openActionsId, setOpenActionsId }) => {
      const { advanceProject, deleteProject, prefs } = useStore();
      const [weather, setWeather] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(false);
      const [confirmDone, setConfirmDone] = useState(false);

      useEffect(() => { if (project.lat && project.lng) fetchWeather(project.lat, project.lng).then(setWeather).catch(console.error); }, [project.lat, project.lng]);
      const sun = weather?.daily?.[0];
      const wakeUp = calcWakeUp(sun?.sunrise, project.travelTime?.durationSeconds, prefs.prepTime);

      // Couleurs adaptées au mode sombre/clair
      const colorActive = '#FAF9F7';
      const colorInactive = '#404A48';
      const colorCharcoal = '#8B9B99';
      const colorRed = '#d83152';
      
      const handleDelete = (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (confirmDelete) {
          deleteProject(project.id);
        } else {
          setConfirmDelete(true);
          setConfirmDone(false);
          setTimeout(() => setConfirmDelete(false), 3000);
        }
      };
      
      const handleDone = (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (confirmDone) {
          advanceProject(project.id);
          setConfirmDone(false);
        } else {
          setConfirmDone(true);
          setConfirmDelete(false);
          setTimeout(() => setConfirmDone(false), 3000);
        }
      };

      const isMobile = useIsMobile();
      const cardRef = useRef(null);
      const scrollRef = useRef(null);
      const contentRef = useRef(null);
      const actionsRef = useRef(null);
      const actionsOpen = openActionsId === project.id;
      const setActionsOpen = (v) => setOpenActionsId(v ? project.id : null);
      const actionW = 110;

      useEffect(() => {
        const card = cardRef.current;
        if (!card || !isMobile) return;
        let startX = 0, startY = 0, locked = false, mode = null, open = false, px = 0, lastMoveX = 0, lastMoveT = 0, velocity = 0;
        const ease = 'transform 0.6s cubic-bezier(0.2, 1.5, 0.4, 1)';
        
        const setTx = (v) => {
          px = v;
          if (contentRef.current) contentRef.current.style.transform = `translateX(${-v}px)`;
          if (actionsRef.current) actionsRef.current.style.transform = `translateX(${actionW - v}px)`;
        };

        let rafId = null;
        let pendingTx = null;
        const rafSetTx = (v) => {
          pendingTx = v;
          if (!rafId) {
            rafId = requestAnimationFrame(() => {
              rafId = null;
              if (pendingTx !== null) setTx(pendingTx);
            });
          }
        };

        const onStart = (e) => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          locked = false;
          mode = null;
          lastMoveX = startX;
          lastMoveT = Date.now();
          velocity = 0;
          if (contentRef.current) { contentRef.current.style.transition = 'none'; contentRef.current.style.willChange = 'transform'; }
          if (actionsRef.current) { actionsRef.current.style.transition = 'none'; actionsRef.current.style.willChange = 'transform'; }
        };

        const onMove = (e) => {
          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;
          const now = Date.now();
          const dt = now - (lastMoveT || now);
          if (dt > 0) velocity = (e.touches[0].clientX - (lastMoveX || e.touches[0].clientX)) / dt;
          lastMoveX = e.touches[0].clientX;
          lastMoveT = now;

          if (!locked) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
            if (Math.abs(dy) > Math.abs(dx)) { 
              mode = null; locked = true; 
              // Close actions if open and user scrolls vertically
              if (open) {
                open = false;
                if (contentRef.current) contentRef.current.style.transition = ease;
                if (actionsRef.current) actionsRef.current.style.transition = ease;
                setTx(0);
                setTimeout(() => { setActionsOpen(false); }, 600);
              }
              return; 
            }
            locked = true;
            if (open) {
              mode = 'close';
            } else {
              const sc = scrollRef.current;
              if (sc && sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 2 && dx < 0) {
                mode = 'open';
              }
            }
          }

          if (mode === 'close') {
            e.preventDefault();
            e.stopPropagation();
            rafSetTx(Math.max(0, Math.min(actionW, actionW - dx)));
          } else if (mode === 'open') {
            e.preventDefault();
            e.stopPropagation();
            rafSetTx(Math.min(actionW, Math.max(0, Math.abs(dx) - 8)));
          }
        };

        const onEnd = () => {
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          if (pendingTx !== null) { setTx(pendingTx); pendingTx = null; }
          if (mode === 'close' || mode === 'open') {
            const v = velocity || 0;
            const snap = mode === 'open' 
              ? (px > actionW * 0.3 || v < -0.3)
              : (px > actionW * 0.7 && v > -0.3);
            open = snap;
            if (contentRef.current) contentRef.current.style.transition = ease;
            if (actionsRef.current) actionsRef.current.style.transition = ease;
            setTx(snap ? actionW : 0);
            setTimeout(() => { 
              setActionsOpen(snap);
              if (contentRef.current) contentRef.current.style.willChange = '';
              if (actionsRef.current) actionsRef.current.style.willChange = '';
            }, 600);
          } else {
            if (contentRef.current) { contentRef.current.style.transition = ease; contentRef.current.style.willChange = ''; }
            if (actionsRef.current) { actionsRef.current.style.transition = ease; actionsRef.current.style.willChange = ''; }
          }
          mode = null;
        };

        // Sync open state from React
        const observer = new MutationObserver(() => {});
        const syncOpen = () => { 
          const newOpen = card.dataset.open === 'true'; 
          if (open && !newOpen) {
            // Another card opened, animate this one closed
            if (contentRef.current) contentRef.current.style.transition = ease;
            if (actionsRef.current) actionsRef.current.style.transition = ease;
            setTx(0);
          }
          open = newOpen; 
        };
        const attrObs = new MutationObserver(syncOpen);
        attrObs.observe(card, { attributes: true, attributeFilter: ['data-open'] });

        card.addEventListener('touchstart', onStart, { passive: true });
        card.addEventListener('touchmove', onMove, { passive: false });
        card.addEventListener('touchend', onEnd, { passive: true });
        return () => {
          if (rafId) cancelAnimationFrame(rafId);
          card.removeEventListener('touchstart', onStart);
          card.removeEventListener('touchmove', onMove);
          card.removeEventListener('touchend', onEnd);
          attrObs.disconnect();
        };
      }, [isMobile]);

      const isFirstMount = useRef(true);
      useEffect(() => { 
        const timer = setTimeout(() => { isFirstMount.current = false; }, 600);
        return () => clearTimeout(timer);
      }, []);

      if (isMobile) {
        const tx = actionsOpen ? actionW : 0;
        const ease = 'transform 0.6s cubic-bezier(0.2, 1.5, 0.4, 1)';
        return (
          <div ref={cardRef} data-open={actionsOpen} data-project-id={project.id} className={isFirstMount.current ? 'animate-card-in' : ''} 
            style={{ position: 'relative', overflow: 'hidden', borderRadius: '37px', background: 'rgba(0,0,0,0.14)', margin: '0 12px', marginBottom: '15px', ...(isFirstMount.current ? { animationDelay: `${index * 0.1}s` } : {}), WebkitUserSelect: 'none', userSelect: 'none', WebkitTouchCallout: 'none' }}
          >
            {/* Turquoise glow - center below card, only top visible */}
            <div style={{ position: 'absolute', left: '50%', bottom: '-350px', width: '700px', height: '500px', borderRadius: '50%', background: 'radial-gradient(ellipse 60% 45%, rgba(100,200,190,0.4) 0%, rgba(100,200,190,0.15) 40%, rgba(100,200,190,0) 70%)', mixBlendMode: 'screen', pointerEvents: 'none', transform: 'translateX(-50%)', zIndex: 0 }}/>
            {/* Teal flare - bottom left */}
            <div style={{ position: 'absolute', left: '-430px', bottom: '-430px', width: '660px', height: '660px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(13,116,124,0.6) 0%, rgba(13,116,124,0.2) 40%, rgba(13,116,124,0) 70%)', pointerEvents: 'none', zIndex: 0 }}/>
            <div ref={contentRef} style={{ transform: `translateX(${-tx}px)`, transition: ease, padding: '20px 24px', position: 'relative', willChange: 'transform', backfaceVisibility: 'hidden', WebkitBackfaceVisibility: 'hidden' }}>
              {actionsOpen && (
                <div style={{ position: 'absolute', inset: 0, zIndex: 10 }} 
                  onClick={() => { setActionsOpen(false); }}
                />
              )}
              <div onClick={() => { if (!actionsOpen) onSelect(project); }}>
                <h3 className="font-bebas-book text-charcoal" style={{ fontSize: '24px', lineHeight: '1.1', marginBottom: '0' }}>
                  {project.name} {project.isContest && <StarIcon/>}
                </h3>
                <div style={{ position: 'relative' }}>
                  <div style={{ position: 'absolute', inset: 0, left: '-24px', right: '-150px', background: 'linear-gradient(to top, rgba(0,0,0,0.13), transparent)', pointerEvents: 'none', zIndex: 0 }}/>
                  <div className="flex items-center gap-2 font-bebas-light uppercase" style={{ fontSize: '17px', lineHeight: '1', marginTop: '2px', marginBottom: '0', position: 'relative', zIndex: 1, padding: '4px 0' }}>
                  {project.mandates?.length > 0 && (
                    <span style={{ flexShrink: 0 }}>
                      {project.mandates.map((m, i) => <React.Fragment key={m}>{i > 0 && ' · '}<span style={{ color: m === 'DRONE+C' ? '#d83152' : colorActive }}>{m === 'DRONE+C' ? 'DRONE.C' : m}</span></React.Fragment>)}
                    </span>
                  )}
                  {project.mandates?.length > 0 && <span style={{ color: '#404A48', flexShrink: 0 }}>|</span>}
                  <span style={{ color: (project.orientation?.includes('AM') && sun) ? colorActive : colorInactive, flexShrink: 0 }}>
                    AM {sun ? formatTime(sun.sunrise) : '—'}
                  </span>
                  <span style={{ color: (project.orientation?.includes('PM') && sun) ? colorActive : colorInactive, flexShrink: 0 }}>
                    PM {sun ? formatTime(sun.sunset) : '—'}
                  </span>
                  <span style={{ color: '#404A48', flexShrink: 0 }}>|</span>
                  <span style={{ color: project.travelTime?.durationSeconds ? colorActive : colorInactive, flexShrink: 0 }}>{project.travelTime?.durationSeconds ? formatDuration(project.travelTime.durationSeconds) : '—'}</span>
                  {project.orientation?.includes('AM') && wakeUp && <>
                    <span style={{ color: '#404A48', flexShrink: 0 }}>|</span>
                    <span style={{ color: '#8B9B99', flexShrink: 0, display: 'inline-flex', alignItems: 'center', gap: '3px' }}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8B9B99" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3L2 6"/><path d="M22 6l-3-3"/></svg>
                      {formatTime(wakeUp).replace(':','H')}
                    </span>
                  </>}
                  </div>
                </div>
              </div>
              <div style={{ position: 'relative' }}>
                <div ref={scrollRef}
                  style={{ display: 'flex', overflowX: actionsOpen ? 'hidden' : 'auto', overflowY: 'hidden', WebkitOverflowScrolling: 'touch', scrollbarWidth: 'none', marginTop: '6px' }}
                >
                  <div style={{ flexShrink: 0 }} onClick={() => { if (!actionsOpen) onSelect(project); }}>
                    {project.lat && project.lng ? <WeatherRow daily={weather?.daily} hourly={weather?.hourly} onDayClick={() => { if (!actionsOpen) onSelect(project); }}/> : <p className="text-charcoal-muted text-sm italic py-2">Météo non disponible</p>}
                  </div>
                </div>
                {project.lat && project.lng && <div style={{ position: 'absolute', right: '-24px', top: 0, bottom: 0, width: '36px', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)', WebkitMaskImage: 'linear-gradient(to left, black, transparent)', maskImage: 'linear-gradient(to left, black, transparent)', pointerEvents: 'none', zIndex: 2 }}/>}
              </div>
            </div>
            <div ref={actionsRef} style={{ 
              position: 'absolute', right: 0, top: '35%', bottom: 0, width: `${actionW}px`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px', paddingRight: '12px',
              transform: `translateX(${actionW - tx}px)`, transition: ease
            }}>
              {/* Red/pink glow - moves with swipe */}
              <div style={{ position: 'absolute', left: '100%', top: '50%', width: '400px', height: '400px', borderRadius: '50%', background: 'radial-gradient(ellipse, rgba(216,49,82,0.8) 0%, rgba(216,49,82,0.3) 40%, rgba(216,49,82,0) 70%)', mixBlendMode: 'screen', pointerEvents: 'none', transform: 'translate(-17%, -50%) scaleX(1.22)' }}/>
              <button className="action-pill" style={{ background: 'transparent', border: '1.5px solid rgba(255,255,255,0.2)' }} onClick={() => { setActionsOpen(false); advanceProject(project.id); }}>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B9B99" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <button className="action-pill" style={{ background: 'transparent', border: confirmDelete ? '1.5px solid #FF3B30' : '1.5px solid rgba(255,255,255,0.2)' }} onClick={() => { 
                if (confirmDelete) { deleteProject(project.id); } 
                else { setConfirmDelete(true); setTimeout(() => setConfirmDelete(false), 3000); }
              }}>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={confirmDelete ? '#FF3B30' : '#8B9B99'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
              </button>
            </div>
          </div>
        );
      }

      // Desktop layout (unchanged)
      return (
        <div className="card-glow-wrap">
        <div 
          className={`project-card py-4 px-4 mb-3 hover:bg-cream-dark/30 overflow-hidden animate-card-in border-b border-adaptive`}
          style={{ minWidth: '1100px', animationDelay: `${index * 0.1}s` }}
          onMouseDown={onMouseDownDrag ? (e) => onMouseDownDrag(e, project.id, index) : undefined}
        >
          <div onClick={() => onSelect(project)} className="cursor-pointer" onMouseEnter={() => { if (activeWeatherRowDismiss) { activeWeatherRowDismiss(); activeWeatherRowDismiss = null; } }}>
            <div className="flex items-start justify-between gap-4" style={{ marginBottom: '-10px' }}>
              <h3 className="font-bebas-book text-charcoal flex items-center gap-2" style={{ fontSize: '35px' }}>
                {project.name} {project.isContest && <StarIcon/>}
              </h3>
            </div>
          </div>
          <div className="flex items-center gap-0">
            <div className="min-w-0" style={{ overflow: "visible" }}>
              {project.lat && project.lng ? <WeatherRow daily={weather?.daily} hourly={weather?.hourly} onDayClick={() => onSelect(project)}/> : <p className="text-charcoal-muted text-sm italic py-2 cursor-pointer" onClick={() => onSelect(project)}>Météo non disponible</p>}
            </div>
            <div onMouseEnter={() => { if (activeWeatherRowDismiss) { activeWeatherRowDismiss(); activeWeatherRowDismiss = null; } }} onClick={() => onSelect(project)} className="info-dodge cursor-pointer flex items-stretch flex-shrink-0 font-bebas-bold uppercase ml-4" style={{ fontSize: '22px', minHeight: '110px', lineHeight: '1', marginBottom: '-16px' }}>
              <div className="flex flex-col justify-center pl-2 border-l border-adaptive">

    const WheelColumn = ({ items, selected, onSelect, width, renderItem }) => {
      const ref = useRef(null);
      const itemH = 40;
      const state = useRef({ dragging: false, startY: 0, startScroll: 0, lastY: 0, lastT: 0, vel: 0 });
      
      useEffect(() => {
        if (ref.current) ref.current.scrollTo({ top: items.indexOf(selected) * itemH, behavior: 'smooth' });
      }, []);
      
      const snapAndSelect = () => {
        if (!ref.current) return;
        const idx = Math.round(ref.current.scrollTop / itemH);
        const clamped = Math.max(0, Math.min(idx, items.length - 1));
        ref.current.style.scrollSnapType = 'y mandatory';
        ref.current.scrollTo({ top: clamped * itemH, behavior: 'smooth' });
        if (items[clamped] !== selected) onSelect(items[clamped]);
      };
      
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const s = state.current;
        
        const getY = (e) => e.touches ? e.touches[0].clientY : e.clientY;
        
        const onDown = (e) => {
          s.dragging = true;
          s.startY = getY(e);
          s.startScroll = el.scrollTop;
          s.lastY = s.startY;
          s.lastT = Date.now();
          s.vel = 0;
          el.style.scrollSnapType = 'none';
          if (!e.touches) e.preventDefault();
        };
        const onMove = (e) => {
          if (!s.dragging) return;
          const y = getY(e);
          const now = Date.now();
          const dt = now - s.lastT;
          if (dt > 0) s.vel = (s.lastY - y) / dt;
          s.lastY = y; s.lastT = now;
          el.scrollTop = s.startScroll - (y - s.startY);
          // Live update
          const idx = Math.round(el.scrollTop / itemH);
          const clamped = Math.max(0, Math.min(idx, items.length - 1));
          if (items[clamped] !== selected) onSelect(items[clamped]);
        };
        const onUp = () => {
          if (!s.dragging) return;
          s.dragging = false;
          if (Math.abs(s.vel) > 0.3) {
            const target = el.scrollTop + s.vel * 120;
            el.scrollTop = target;
          }
          snapAndSelect();
        };
        
        el.addEventListener('mousedown', onDown);
        el.addEventListener('touchstart', onDown, { passive: true });
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchend', onUp);
        return () => {
          el.removeEventListener('mousedown', onDown);
          el.removeEventListener('touchstart', onDown);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('mouseup', onUp);
          window.removeEventListener('touchend', onUp);
        };
      }, [items, selected]);
      
      return (
        <div ref={ref}
          style={{ height: itemH * 3, overflow: 'auto', scrollSnapType: 'y mandatory', WebkitOverflowScrolling: 'touch', scrollbarWidth: 'none', width, cursor: 'grab', userSelect: 'none' }}>
          <div style={{ height: itemH }}/>
          {items.map((item, i) => (
            <div key={i} style={{
              height: itemH, display: 'flex', alignItems: 'center', justifyContent: 'center',
              scrollSnapAlign: 'center', fontSize: item === selected ? '22px' : '17px',
              color: item === selected ? '#ffffff' : 'rgba(255,255,255,0.3)',

        </div>
      );

        // Static SunCalc lines (sunrise, sunset, arc)
        // Calculate R from map bounds so lines always fit in viewport
        const getLineR = (fraction) => {
          const bounds = map.getBounds();

          const ne = bounds.getNorthEast();
          const sw = bounds.getSouthWest();
          const latSpan = Math.abs(ne.lat() - sw.lat());

          // Dark pie-slice polygon for sun arc
          const steps = 36;

          const sLat2 = project.lat + shadowR * Math.cos(shadowBearing * Math.PI / 180);

        // Sun/Moon dot — custom overlay with motion blur

          sunPosMarkerRef.current.setNight(isNight);
          if (!sunPosMarkerRef.current.getMap()) sunPosMarkerRef.current.setMap(map);
        } else {
          class SunDotOverlay extends google.maps.OverlayView {
            constructor(lat, lng) {
              super();
              this.lat = lat;
              this.lng = lng;
              this.div = null;
              this._isNight = false;
            }
            onAdd() {

              const proj = this.getProjection();
              if (!proj || !this.div) return;
              const pos = proj.fromLatLngToDivPixel(new google.maps.LatLng(this.lat, this.lng));
              this.div.style.left = (pos.x - 9) + 'px';
              this.div.style.top = (pos.y - 9) + 'px';
            }
            setNight(n) {
              if (this._isNight === n || !this.div) return;
              this._isNight = n;
              if (n) {
                this.div.style.background = 'radial-gradient(circle, #c8d4f0 50%, rgba(150,170,220,0.3) 100%)';
                this.div.style.boxShadow = '0 0 8px rgba(150,170,220,0.5)';
              } else {
                this.div.style.background = 'radial-gradient(circle, #ffe26b 50%, rgba(255,226,107,0.3) 100%)';
                this.div.style.boxShadow = '0 0 8px rgba(255,226,107,0.5)';
              }
            }
            moveTo(lat, lng) {
              const proj = this.getProjection();
              if (proj && this.div) {
                const oldPos = proj.fromLatLngToDivPixel(new google.maps.LatLng(this.lat, this.lng));
                this.lat = lat;
                this.lng = lng;

                const newPos = proj.fromLatLngToDivPixel(new google.maps.LatLng(lat, lng));

                const dist = Math.sqrt(dx*dx + dy*dy);

                this.lng = lng;
              }

        if (nowH >= (srTime - 1) && nowH <= (ssTime + 1)) {

          const lat2 = project.lat + R * Math.cos(bearing * Math.PI / 180);

        }

                          const isSunrise = sunriseH === hr;
                          const isSunset = sunsetH === hr;
                          const isNight = sunriseH !== null && sunsetH !== null && (hr < sunriseH || hr >= sunsetH);
                          const icon = getIconFromCloudcover(h.cloudcover, h.icon, isNight);
                          
                          // Format sunrise/sunset time
                          let timeLabel = `${hr}H`;
                          if (isSunrise && sunriseM !== null) {
                            const formattedSR = formatTime(day.sun.sunrise).replace(':','H');
                            timeLabel = formattedSR;
                          } else if (isSunset && sunsetM !== null) {

                            timeLabel = formattedSS;
                          }

                              {isSunset && <svg width="18" height="10" viewBox="0 0 18 10" style={{ marginBottom: '8px' }}><polyline points="1,1 9,8 17,1" fill="none" stroke="#404A48" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                              {!(isSunrise || isSunset) && <div style={{ height: '10px', marginBottom: '8px' }}/>}
                              <span className="font-bebas-bold leading-none" style={{ 
                                fontSize: (isSunrise || isSunset) ? '20px' : '18px',
                                color: (isSunrise || isSunset) ? '#ffffff' : undefined
                              }}>
                                <span className={!(isSunrise || isSunset) ? 'text-charcoal-muted' : ''}>{timeLabel}</span>
                              </span>
                              <WeatherIcon type={icon} className={`w-10 h-10 ${isNight ? 'opacity-50' : ''}`}/>
                              <span className="font-bebas-bold text-base leading-none text-charcoal" style={{ marginTop: '4px' }}>{h.temp}°</span>
                              <span className="font-bebas-bold text-base leading-none text-charcoal-muted" style={{ marginTop: '4px' }}>{h.cloudcover != null ? `${h.cloudcover}%` : '--'}</span>
                              <span className="font-bebas-bold text-sm leading-none text-charcoal-muted mt-1">{h.wind} <span className="text-xs">KM/H</span></span>
                              {h.precip > 0 && <span className="font-bebas-bold text-sm leading-none mt-1" style={{ color: '#7dd3c6' }}>{h.precip < 1 ? h.precip.toFixed(1) : Math.round(h.precip)} <span className="text-xs">MM</span></span>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </React.Fragment>
                );
              })}

        if (!isMobile) return;
        const onScroll = () => {
          if (!glowRef.current) return;
          const scrollY = window.scrollY || window.pageYOffset;
          // Map scroll to a 0-1 progress along the pill perimeter
          const t = ((scrollY * 0.3) % 360) / 360;
          // Trace the pill border: top edge left→right, then right cap, bottom right→left, left cap
          let gx, gy;
          if (t < 0.35) {
            // Top edge: left to right
            gx = (t / 0.35) * 100;
            gy = 0;
          } else if (t < 0.5) {
            // Right side: top to bottom
            const p = (t - 0.35) / 0.15;
            gx = 100;
            gy = p * 100;
          } else if (t < 0.85) {
            // Bottom edge: right to left
            gx = (1 - (t - 0.5) / 0.35) * 100;
            gy = 100;
          } else {
            // Left side: bottom to top
            const p = (t - 0.85) / 0.15;
            gx = 0;
            gy = (1 - p) * 100;
          }
          glowRef.current.style.setProperty('--gx', gx + '%');
          glowRef.current.style.setProperty('--gy', gy + '%');
        };
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);

                    padding: '0 8px',
                    transition: 'height 0.2s ease-out, background-color 0.15s ease-out',

                  }}
                >
                  <span
