    // ===== GEO WEATHER CARD (mobile) =====
    const GeoWeatherCard = () => {
      const [geoData, setGeoData] = useState(null);
      const [status, setStatus] = useState('loading');

      // Géolocalisation active (HTTPS requis)

      useEffect(() => {
        if (!navigator.geolocation) { setStatus('error'); return; }
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            try {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              // Reverse geocode for city name
              let cityName = 'Ma position';
              try {
                const geocoder = new google.maps.Geocoder();
                const res = await new Promise((resolve, reject) => geocoder.geocode({ location: { lat, lng } }, (results, status) => status === 'OK' ? resolve(results) : reject(status)));
                const city = res.find(r => r.types.includes('locality')) || res.find(r => r.types.includes('administrative_area_level_2')) || res[0];
                if (city) cityName = city.formatted_address.split(',').slice(0, 2).join(',');
              } catch(e) { console.log('Reverse geocode failed', e); }
              const weather = await fetchWeather(lat, lng);
              const today = weather.daily?.[0];
              if (!today) { setStatus('error'); return; }
              const nowH = new Date().getHours();
              const currentHourly = weather.hourly?.find(h => new Date(h.time).getHours() === nowH);
              const cloudcover = today.cloudcover ?? currentHourly?.cloudcover ?? null;
              const icon = today.icon || (cloudcover !== null ? null : 'cloudy');
              const weatherIcon = cloudcover !== null 
                ? (cloudcover <= 10 ? 'sunny-bright' : cloudcover <= 20 ? 'sunny' : cloudcover <= 30 ? 'sunny-few-clouds' : cloudcover <= 40 ? 'mostly-sunny' : cloudcover <= 55 ? 'partly-cloudy' : cloudcover <= 70 ? 'mostly-cloudy' : cloudcover <= 85 ? 'cloudy-glimpse' : 'cloudy')
                : (icon || 'cloudy');
              setGeoData({ cityName, sunrise: today.sunrise, sunset: today.sunset, high: today.high, low: today.low, cloudcover, weatherIcon });
              setStatus('done');
            } catch(e) { console.error('GeoWeather error', e); setStatus('error'); }
          },
          (err) => { console.error('Geolocation denied', err); setStatus('error'); },
          { enableHighAccuracy: false, timeout: 10000 }
        );
      }, []);

      const now = new Date();
      const days = ['DIMANCHE','LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI','SAMEDI'];
      const months = ['JAN','FÉV','MAR','AVR','MAI','JUIN','JUIL','AOÛT','SEP','OCT','NOV','DÉC'];
      const dayName = days[now.getDay()];
      const dateStr = `${dayName} ${now.getDate()} ${months[now.getMonth()]}`;

      const fmtSun = (iso) => {
        if (!iso) return '--H--';
        const d = new Date(iso);
        return `${d.getHours()}H${String(d.getMinutes()).padStart(2,'0')}`;
      };

      if (status === 'loading') return (
        <div style={{ margin: '0 12px', marginBottom: '35px', borderRadius: '37px', background: 'rgba(0,0,0,0.14)', overflow: 'hidden', padding: '24px 28px', textAlign: 'center' }}>
          <div className="font-bebas-regular" style={{ fontSize: '13px', color: '#424a48' }}>Chargement météo...</div>
        </div>
      );
      if (status === 'error' || !geoData) return null;

      // Done: show full weather card
      return (
        <div style={{ margin: '0 12px', marginBottom: '15px', borderRadius: '37px', background: 'transparent', overflow: 'hidden', padding: '20px 28px 5px' }}>
          {/* Top row: date + city */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '2px', gap: '12px', paddingLeft: '0', textAlign: 'center' }}>
            <div className="font-bebas-regular" style={{ fontSize: '15px', color: 'rgba(255,255,255,0.35)', textTransform: 'uppercase', letterSpacing: '0.03em', whiteSpace: 'nowrap', width: '100%', textAlign: 'center' }}>
              AUJOURD'HUI {dateStr} / {geoData.cityName}
            </div>
          </div>
          {/* Main content — centered */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '80px' }}>
            {/* Sunrise / Sunset with PNG */}
            <div style={{ flex: '0 0 auto' }}>
              <div style={{ display: 'flex', gap: '28px', alignItems: 'flex-end' }}>
                <div style={{ textAlign: 'center' }}>
                  <div className="font-bebas-regular" style={{ fontSize: '15px', color: 'rgba(255,255,255,0.35)', letterSpacing: '0.05em', marginBottom: '2px' }}>LEVER</div>
                  <div className="font-bebas-book" style={{ fontSize: '25px', color: '#ffffff', lineHeight: '1' }}>{fmtSun(geoData.sunrise)}</div>
                </div>
                <div style={{ textAlign: 'center' }}>
                  <div className="font-bebas-regular" style={{ fontSize: '15px', color: 'rgba(255,255,255,0.35)', letterSpacing: '0.05em', marginBottom: '2px' }}>COUCHER</div>
                  <div className="font-bebas-book" style={{ fontSize: '25px', color: '#ffffff', lineHeight: '1' }}>{fmtSun(geoData.sunset)}</div>
                </div>
              </div>
              {/* Sunrise/Sunset PNG with colored flares */}
              <div style={{ position: 'relative', marginTop: '2px', display: 'inline-block', zoom: 0.5 }}>
                <img src="imgProjet/sunsetsunrise.png" alt="" style={{ display: 'block', mixBlendMode: 'screen', opacity: 0.28 }}/>
                {/* Yellow flare over sunrise (left circle) */}
                <div style={{ position: 'absolute', left: '-5%', top: '-40px', width: '120px', height: '120px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(255,226,107,0.2) 0%, rgba(255,226,107,0.06) 45%, rgba(255,226,107,0) 70%)', mixBlendMode: 'screen', pointerEvents: 'none' }}/>
                {/* Orange flare over sunset (right circle) */}
                <div style={{ position: 'absolute', right: '-5%', top: '-40px', width: '120px', height: '120px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(210,100,20,0.25) 0%, rgba(210,100,20,0.07) 45%, rgba(210,100,20,0) 70%)', mixBlendMode: 'screen', pointerEvents: 'none' }}/>
              </div>
            </div>
            {/* Right side: icon + cloud + temps */}
            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <div style={{ textAlign: 'center', position: 'relative', left: '-25px' }}>
                <WeatherIcon type={geoData.weatherIcon} className="w-8 h-8"/>
                <div className="font-bebas-book" style={{ fontSize: '13px', color: 'rgba(255,255,255,0.6)', marginTop: '2px' }}>
                  {geoData.cloudcover !== null ? `${geoData.cloudcover}%` : '—'}
                </div>
              </div>
              <div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px' }}>
                  <span className="font-bebas-regular" style={{ fontSize: '15px', color: 'rgba(255,255,255,0.35)' }}>MAX</span>
                  <span className="font-bebas-book" style={{ fontSize: '25px', color: '#ffffff', lineHeight: '1' }}>{geoData.high}°</span>
                </div>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px', marginTop: '2px' }}>
                  <span className="font-bebas-regular" style={{ fontSize: '15px', color: 'rgba(255,255,255,0.35)' }}>MIN</span>
                  <span className="font-bebas-book" style={{ fontSize: '25px', color: '#ffffff', lineHeight: '1' }}>{geoData.low}°</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const TodoView = ({ onSelect, onAddProject, addingProject, plusRef }) => {
      const { projects, reorderProjects } = useStore();
      const todoProjects = projects.filter(p => p.status === ProjectStatus.TODO);
      const [openActionsId, setOpenActionsId] = useState(null);
      const dragRef = useRef(null);
      const listRef = useRef(null);
      
      // Close actions on vertical scroll
      useEffect(() => {
        if (!isMobile) return;
        const onScroll = () => { if (openActionsId) setOpenActionsId(null); };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, [isMobile, openActionsId]);
      
      // Desktop mouse-based drag & drop
      const handleMouseDownDrag = useCallback((e, id, idx) => {
        // Only left click, ignore buttons/inputs
        if (e.button !== 0 || e.target.closest('button, a, input, textarea, .hour-scroll')) return;
        
        if (!listRef.current) return;
        const cards = Array.from(listRef.current.querySelectorAll('.project-card'));
        if (!cards[idx]) return;
        
        const startY = e.clientY;
        const startX = e.clientX;
        let dragStarted = false;
        
        // Snapshot all card rects
        const rects = cards.map(c => {
          const r = c.getBoundingClientRect();
          const s = window.getComputedStyle(c);
          return { top: r.top, height: r.height, totalH: r.height + (parseFloat(s.marginBottom) || 0) };
        });
        
        const initDrag = () => {
          dragStarted = true;
          window.__isDragging = true;
          if (activeWeatherRowDismiss) { activeWeatherRowDismiss(); activeWeatherRowDismiss = null; }
          
          dragRef.current = {
            id, startIdx: idx, gapIdx: idx,
            startY, cards, rects, totalH: rects[idx].totalH
          };
          
          cards[idx].classList.add('is-being-dragged');
          
          document.body.style.userSelect = 'none';
          document.body.style.cursor = 'grabbing';
        };
        
        const onMove = (ev) => {
          const deltaY = ev.clientY - startY;
          const deltaX = ev.clientX - startX;
          
          // Require 5px movement to start drag
          if (!dragStarted) {
            if (Math.abs(deltaY) < 5 && Math.abs(deltaX) < 5) return;
            initDrag();
          }
          
          const d = dragRef.current;
          if (!d) return;
          
          // Move dragged card to follow mouse
          d.cards[d.startIdx].style.transform = `translateY(${deltaY}px)`;
          
          const mouseY = ev.clientY;
          let newGap = d.gapIdx;
          
          // Step down one at a time: cursor past top ~25% of next non-dragged card
          while (newGap < d.rects.length - 1) {
            let next = newGap + 1;
            if (next === d.startIdx) next++; // skip dragged card slot
            if (next >= d.rects.length) break;
            const threshold = d.rects[next].top + d.rects[next].height * 0.25;
            if (mouseY > threshold) {
              newGap = next;
            } else break;
          }
          
          // Step up one at a time: cursor above bottom ~25% of prev non-dragged card
          while (newGap > 0) {
            let prev = newGap - 1;
            if (prev === d.startIdx) prev--; // skip dragged card slot
            if (prev < 0) break;
            const threshold = d.rects[prev].top + d.rects[prev].height * 0.75;
            if (mouseY < threshold) {
              newGap = prev;
            } else break;
          }
          
          if (newGap !== d.gapIdx) {
            d.gapIdx = newGap;
            // Shift other cards to create gap at new position
            d.cards.forEach((card, i) => {
              if (i === d.startIdx) return;
              let shift = 0;
              if (d.startIdx < d.gapIdx) {
                // Dragged down: cards between startIdx+1..gapIdx shift UP
                if (i > d.startIdx && i <= d.gapIdx) shift = -d.totalH;
              } else if (d.startIdx > d.gapIdx) {
                // Dragged up: cards between gapIdx..startIdx-1 shift DOWN
                if (i >= d.gapIdx && i < d.startIdx) shift = d.totalH;
              }
              card.style.transform = shift ? `translateY(${shift}px)` : '';
            });
          }
        };
        
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          
          if (!dragStarted) return; // Was just a click, not a drag
          
          window.__isDragging = false;
          const d = dragRef.current;
          if (!d) return;
          
          // Block the click event that fires after mouseup
          const blocker = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
          listRef.current.addEventListener('click', blocker, { capture: true, once: true });
          setTimeout(() => listRef.current?.removeEventListener('click', blocker, { capture: true }), 100);
          
          // Reorder if position changed
          if (d.startIdx !== d.gapIdx) {
            const targetProject = todoProjects[d.gapIdx];
            if (targetProject) reorderProjects(d.id, targetProject.id);
          }
          
          // Clear all inline styles and classes
          d.cards.forEach(card => {
            card.classList.remove('is-being-dragged');
            card.style.transform = '';
          });
          document.body.style.userSelect = '';
          document.body.style.cursor = '';
          
          dragRef.current = null;
        };
        
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      }, [todoProjects, reorderProjects]);

      const isMobile = useIsMobile();

      // === Mobile long press drag-to-reorder (Microsoft To Do style) ===
      useEffect(() => {
        if (!isMobile || !listRef.current) return;
        const list = listRef.current;
        let longPressTimer = null;
        let drag = { active: false, id: null, startY: 0, startX: 0, clone: null, origCard: null, cardRects: [], startIdx: 0, currentIdx: 0 };

        const getCard = (el) => {
          while (el && !el.dataset.projectId) el = el.parentElement;
          return el;
        };

        const getCardRects = () => {
          const cards = list.querySelectorAll('[data-project-id]');
          return Array.from(cards).map(c => ({
            el: c,
            id: c.dataset.projectId,
            rect: c.getBoundingClientRect(),
            h: c.offsetHeight
          }));
        };

        const animateCards = (currentIdx) => {
          const cards = drag.cardRects;
          const startIdx = drag.startIdx;
          cards.forEach((c, i) => {
            if (c.id === drag.id) return;
            let offset = 0;
            if (startIdx < currentIdx) {
              // Dragging down: cards between start+1..current move UP
              if (i > startIdx && i <= currentIdx) offset = -cards[startIdx].h - 12;
            } else if (startIdx > currentIdx) {
              // Dragging up: cards between current..start-1 move DOWN
              if (i >= currentIdx && i < startIdx) offset = cards[startIdx].h + 12;
            }
            c.el.style.transition = 'transform 0.25s cubic-bezier(0.25,1,0.5,1)';
            c.el.style.transform = offset ? `translateY(${offset}px)` : '';
          });
        };

        const onTouchStart = (e) => {
          // Cancel if multi-touch (pinch zoom)
          if (e.touches.length > 1) { clearTimeout(longPressTimer); return; }
          
          const card = getCard(e.target);
          if (!card) return;
          
          // Don't start drag if swipe actions are open
          if (card.dataset.open === 'true') return;
          
          const touch = e.touches[0];
          drag.startX = touch.clientX;
          drag.startY = touch.clientY;
          drag.origCard = card;
          drag.id = card.dataset.projectId;
          
          longPressTimer = setTimeout(() => {
            // Activate drag
            drag.active = true;
            drag.cardRects = getCardRects();
            drag.startIdx = drag.cardRects.findIndex(c => c.id === drag.id);
            drag.currentIdx = drag.startIdx;
            
            // Haptic
            if (navigator.vibrate) navigator.vibrate(30);
            
            // Create floating clone
            const rect = card.getBoundingClientRect();
            const clone = card.cloneNode(true);
            clone.style.cssText = `
              position: fixed; left: ${rect.left}px; top: ${rect.top}px;
              width: ${rect.width}px; height: ${rect.height}px;
              z-index: 99999; pointer-events: none;
              transform: scale(1.04); 
              box-shadow: 0 16px 48px rgba(0,0,0,0.45);
              border-radius: 8px; overflow: hidden;
              transition: transform 0.2s, box-shadow 0.2s;
              will-change: top;
            `;
            document.body.appendChild(clone);
            drag.clone = clone;
            drag.cloneStartTop = rect.top;
            
            // Hide original
            card.style.opacity = '0';
            card.style.transition = 'none';
            
            // Lock scroll
            document.body.style.overflow = 'hidden';
            document.body.style.touchAction = 'none';
          }, 500);
        };

        const onTouchMove = (e) => {
          // Cancel if multi-touch (pinch zoom)
          if (e.touches.length > 1) { clearTimeout(longPressTimer); return; }
          
          if (!drag.active) {
            // Cancel long press if moved too much
            const dx = Math.abs(e.touches[0].clientX - drag.startX);
            const dy = Math.abs(e.touches[0].clientY - drag.startY);
            if (dx > 10 || dy > 10) {
              clearTimeout(longPressTimer);
            }
            return;
          }
          
          e.preventDefault();
          const touch = e.touches[0];
          const dy = touch.clientY - drag.startY;
          
          // Move floating clone
          if (drag.clone) {
            drag.clone.style.top = `${drag.cloneStartTop + dy}px`;
          }
          
          // Determine which index we're over
          const cards = drag.cardRects;
          let newIdx = drag.startIdx;
          for (let i = 0; i < cards.length; i++) {
            if (cards[i].id === drag.id) continue;
            const midY = cards[i].rect.top + cards[i].rect.height / 2;
            if (touch.clientY > midY) {
              newIdx = i >= drag.startIdx ? i : i;
            }
          }
          // More precise: check from top
          newIdx = drag.startIdx;
          for (let i = 0; i < cards.length; i++) {
            const midY = cards[i].rect.top + cards[i].rect.height / 2;
            if (touch.clientY > midY) newIdx = i;
          }
          
          if (newIdx !== drag.currentIdx) {
            drag.currentIdx = newIdx;
            animateCards(newIdx);
          }
          
          // Auto-scroll near edges
          if (touch.clientY < 80) {
            window.scrollBy(0, -6);
          } else if (touch.clientY > window.innerHeight - 80) {
            window.scrollBy(0, 6);
          }
        };

        const onTouchEnd = () => {
          clearTimeout(longPressTimer);
          
          if (drag.active) {
            const fromIdx = drag.startIdx;
            const toIdx = drag.currentIdx;
            
            // Animate clone to target position
            if (drag.clone && drag.cardRects[toIdx]) {
              const targetRect = drag.cardRects[toIdx].rect;
              drag.clone.style.transition = 'top 0.25s cubic-bezier(0.25,1,0.5,1), transform 0.25s, box-shadow 0.25s';
              drag.clone.style.top = `${targetRect.top}px`;
              drag.clone.style.transform = 'scale(1)';
              drag.clone.style.boxShadow = '0 0 0 rgba(0,0,0,0)';
            }
            
            // Reset all card transforms
            drag.cardRects.forEach(c => {
              c.el.style.transition = 'transform 0.25s cubic-bezier(0.25,1,0.5,1), opacity 0.25s';
              c.el.style.transform = '';
            });
            
            // After animation, do the actual reorder
            setTimeout(() => {
              // Remove clone
              if (drag.clone && drag.clone.parentNode) {
                drag.clone.parentNode.removeChild(drag.clone);
              }
              
              // Show original
              if (drag.origCard) {
                drag.origCard.style.opacity = '';
                drag.origCard.style.transition = '';
              }
              
              // Reorder if moved
              if (fromIdx !== toIdx) {
                const targetId = drag.cardRects[toIdx]?.id;
                if (targetId && drag.id) {
                  reorderProjects(drag.id, targetId);
                }
              }
              
              // Reset
              drag.active = false;
              drag.clone = null;
              drag.origCard = null;
              drag.id = null;
              document.body.style.overflow = '';
              document.body.style.touchAction = '';
            }, 280);
          }
          
          drag.active = false;
        };

        list.addEventListener('touchstart', onTouchStart, { passive: true });
        list.addEventListener('touchmove', onTouchMove, { passive: false });
        list.addEventListener('touchend', onTouchEnd, { passive: true });
        list.addEventListener('touchcancel', onTouchEnd, { passive: true });
        
        return () => {
          clearTimeout(longPressTimer);
          list.removeEventListener('touchstart', onTouchStart);
          list.removeEventListener('touchmove', onTouchMove);
          list.removeEventListener('touchend', onTouchEnd);
          list.removeEventListener('touchcancel', onTouchEnd);
          document.body.style.overflow = '';
          document.body.style.touchAction = '';
          if (drag.clone && drag.clone.parentNode) drag.clone.parentNode.removeChild(drag.clone);
        };
      }, [isMobile, todoProjects]);
      
      return (
        <div className="pb-8" style={{ paddingLeft: isMobile ? '0' : 'max(0px, calc((100vw - 1200px) / 2))', paddingTop: isMobile ? 'calc(16px + env(safe-area-inset-top))' : '100px' }}>
          {!isMobile && <div className="px-4 md:px-6">
            <div ref={plusRef} style={{ width: '68px', height: '88px', marginLeft: '-6px' }}/>
          </div>}
          {isMobile && <div ref={plusRef} style={{ width: 0, height: 0 }}/>}
          {isMobile && <GeoWeatherCard/>}
          {todoProjects.length === 0 ? <div className="text-center py-16"><div className="text-6xl mb-4">📷</div><p className="text-charcoal-muted">{isMobile ? 'Appuyez sur + pour ajouter un projet' : 'Cliquez sur + pour ajouter un projet'}</p></div>
          : <div ref={listRef}>{todoProjects.map((p, i) => <ProjectCard key={p.id} project={p} index={i} onSelect={onSelect} onMouseDownDrag={isMobile ? undefined : handleMouseDownDrag} openActionsId={openActionsId} setOpenActionsId={setOpenActionsId}/>)}</div>}
        </div>
      );
    };

    const RetouchingView = ({ onSelect }) => {
      const { projects } = useStore();
      const isMobile = useIsMobile();
      const retouching = projects.filter(p => p.status === ProjectStatus.RETOUCHING);
      const done = projects.filter(p => p.status === ProjectStatus.DONE);
      return (
        <div className="pb-8" style={{ paddingLeft: isMobile ? '0' : 'max(0px, calc((100vw - 1200px) / 2))', paddingTop: isMobile ? 'calc(16px + env(safe-area-inset-top))' : '100px' }}>
          {retouching.length === 0 ? <div className="text-center py-16"><p className="font-bebas-book text-charcoal-muted" style={{ fontSize: '24px' }}>Aucun projet à retoucher</p></div>
          : <div>{retouching.map(p => <RetouchingCard key={p.id} project={p} onSelect={onSelect}/>)}</div>}
          {done.length > 0 && <>
            <div className="px-4 py-4 mt-8 border-b border-adaptive"><h2 className="font-bebas-light" style={{ fontSize: '28px', color: '#424141' }}>TERMINÉ <span>({done.length})</span></h2></div>
            <div>{done.map(p => <DoneCard key={p.id} project={p}/>)}</div>
          </>}
        </div>
      );
    };

    const PreferencesView = () => {
      const { prefs, setPrefs } = useStore();
      const isMobile = useIsMobile();
      const [prepTime, setPrepTime] = useState(prefs.prepTime || 60);
      const [msg, setMsg] = useState(null);
      const [saving, setSaving] = useState(false);
      const homeInputRef = React.useRef(null);
      const autocompleteRef = React.useRef(null);

      // Setup Google Places Autocomplete for home address
      useEffect(() => {
        if (homeInputRef.current && !autocompleteRef.current && window.google) {
          autocompleteRef.current = new google.maps.places.Autocomplete(homeInputRef.current, {
            types: ['address'],
            componentRestrictions: { country: 'ca' },
            fields: ['formatted_address', 'geometry']
          });
          
          autocompleteRef.current.addListener('place_changed', async () => {
            const place = autocompleteRef.current.getPlace();
            if (place.geometry) {
              setSaving(true);
              setPrefs({ 
                homeAddress: place.formatted_address, 
                homeLat: place.geometry.location.lat(), 
                homeLng: place.geometry.location.lng() 
              });
              setMsg({ type: 'success', text: 'Adresse de départ sauvegardée!' });
              setSaving(false);
            }
          });
        }
      }, []);

      const saveHomeManual = async () => {
        const address = homeInputRef.current?.value;
        if (!address) return;
        
        setSaving(true);
        try {
          const result = await geocodeAddress(address);
          setPrefs({ 
            homeAddress: result.formattedAddress, 
            homeLat: result.lat, 
            homeLng: result.lng 
          });
          homeInputRef.current.value = result.formattedAddress;
          setMsg({ type: 'success', text: 'Adresse sauvegardée!' });
        } catch (e) { 
          setMsg({ type: 'error', text: 'Adresse non trouvée' }); 
        }
        setSaving(false);
      };

      return (
        <div className="pb-8" style={{ paddingLeft: isMobile ? '0' : 'max(0px, calc((100vw - 1200px) / 2))', paddingTop: isMobile ? 'calc(16px + env(safe-area-inset-top))' : '100px' }}>
          <div className={isMobile ? 'px-4' : 'px-8 md:px-12'}>
            {msg && <div className={`mb-6 p-3 rounded ${msg.type === "success" ? "bg-transparent" : "bg-red-50 text-red-700"}`} style={msg.type === "success" ? { color: "#7dd3c6" } : {}}>{msg.text}</div>}
            <div className="space-y-5" style={{ maxWidth: '600px' }}>
              <div>
                <label className="font-bebas-book text-charcoal-muted" style={{ fontSize: '22px' }}>ADRESSE DE LA MAISON</label>
                <p className="font-bebas-light text-charcoal-muted" style={{ fontSize: '19px', marginTop: '2px' }}>Adresse de départ par défaut pour calculer les temps de trajet</p>
                <div style={{ border: '1px solid rgba(255,255,255,0.15)', padding: '8px 12px', marginTop: '4px' }}>
                  <input 
                    ref={homeInputRef}
                    type="text" 
                    defaultValue={prefs.homeAddress || ''} 
                    placeholder="Commencez à taper votre adresse..." 
                    className="w-full bg-transparent text-charcoal" style={{ fontSize: '15px', outline: 'none', border: 'none', color: 'rgba(255,255,255,0.85)' }}
                  />
                </div>
                {prefs.homeLat && <p className="text-xs mt-2" style={{ color: "#7dd3c6" }}>✓ {prefs.homeAddress}</p>}
              </div>

              <div className="pb-4 border-b border-adaptive">
                <label className="font-bebas-book text-charcoal-muted" style={{ fontSize: '22px' }}>TEMPS DE PRÉPARATION</label>
                <p className="font-bebas-light text-charcoal-muted" style={{ fontSize: '19px', marginTop: '2px' }}>Temps pour vous préparer avant de partir (calcul de l'heure de réveil)</p>
                <div className="flex items-center gap-3" style={{ marginTop: '4px' }}>
                  <div style={{ border: '1px solid rgba(255,255,255,0.15)', padding: '8px 12px', display: 'inline-block' }}>
                    <input type="number" value={prepTime} onChange={e => { setPrepTime(e.target.value); setPrefs({ prepTime: parseInt(e.target.value) || 0 }); }} min="0" max="180" className="bg-transparent text-charcoal" style={{ fontSize: '15px', outline: 'none', border: 'none', color: 'rgba(255,255,255,0.85)', width: '60px' }}/>
                  </div>
                  <span className="font-bebas-light text-charcoal-muted" style={{ fontSize: '19px' }}>MINUTES</span>
                </div>
              </div>

              <div className="pb-4 border-b border-adaptive">
                <label className="font-bebas-book text-charcoal-muted" style={{ fontSize: '22px' }}>DONNÉES</label>
                <p className="font-bebas-light text-charcoal-muted" style={{ fontSize: '19px', marginTop: '2px' }}>Exporter ou importer vos projets et préférences pour les transférer sur un autre appareil</p>
                <div className="flex items-center gap-4" style={{ marginTop: '8px' }}>
                  <button 
                    onClick={() => {
                      const data = { projects: JSON.parse(localStorage.getItem('sp-projects') || '[]'), prefs: JSON.parse(localStorage.getItem('sp-prefs') || '{}'), exportDate: new Date().toISOString() };
                      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a'); a.href = url; a.download = `meteoshoot-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
                      URL.revokeObjectURL(url);
                      setMsg({ type: 'success', text: 'Export téléchargé!' });
                    }}
                    className="font-bebas-bold hover:text-blue-500" style={{ fontSize: '22px', color: 'rgba(255,255,255,0.7)' }}
                  >EXPORTER</button>
                  <button 
                    onClick={() => { document.getElementById('import-file-input').click(); }}
                    className="font-bebas-bold hover:text-blue-500" style={{ fontSize: '22px', color: 'rgba(255,255,255,0.3)' }}
                  >IMPORTER</button>
                  <input id="import-file-input" type="file" accept=".json" className="hidden" onChange={(e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                      try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.projects || !Array.isArray(data.projects)) { setMsg({ type: 'error', text: 'Fichier invalide' }); return; }
                        const count = data.projects.length;
                        if (confirm(`Importer ${count} projet${count > 1 ? 's' : ''}? Ceci remplacera toutes vos données actuelles.`)) {
                          localStorage.setItem('sp-projects', JSON.stringify(data.projects));
                          if (data.prefs) localStorage.setItem('sp-prefs', JSON.stringify(data.prefs));
                          setMsg({ type: 'success', text: `${count} projet${count > 1 ? 's' : ''} importé${count > 1 ? 's' : ''}! Rechargement...` });
                          setTimeout(() => location.reload(), 1000);
                        }
                      } catch(err) { setMsg({ type: 'error', text: 'Erreur de lecture du fichier' }); }
                    };
                    reader.readAsText(file);

                  }}/>
                </div>
              </div>

              <div className="pt-4 pb-4 border-b border-adaptive">
                <label className="font-bebas-book text-charcoal-muted" style={{ fontSize: '22px' }}>COMPTE</label>
                <p className="font-bebas-light" style={{ fontSize: '15px', color: '#7dd3c6', marginTop: '4px' }}>✓ Connecté — sync activée</p>
                <button 
                  onClick={() => { if (window.confirm('Déconnexion?')) { supabase.auth.signOut(); } }}
                  className="font-bebas-bold"
                  style={{ fontSize: '18px', color: '#d83152', background: 'none', border: 'none', cursor: 'pointer', marginTop: '8px' }}
                >
                  DÉCONNEXION
                </button>
              </div>

              <div className="pt-4">
                <p className="font-bebas-light text-charcoal-muted" style={{ fontSize: '19px' }}>MeteoShoot v1.3.0 — Supabase sync<br/>Météo: GEM Canada (Env. Canada) via Open-Meteo • Géocodage: Google Maps</p>
              </div>
            </div>

        </div>
      );
    };

    // === Mobile New Project Screen (slides in from right) ===
    const MobileNewProjectScreen = ({ isOpen, onClose, onCreated }) => {
      const { addProject, prefs } = useStore();
      const [form, setForm] = useState({ name: '', address: '', lat: null, lng: null, mandates: [], orientation: [], isContest: false });
      const [loading, setLoading] = useState(false);
      const addressInputRef = React.useRef(null);
      const nameInputRef = React.useRef(null);
      const autocompleteRef = React.useRef(null);
      const prevOpen = React.useRef(false);

      // Reset form when opening
      useEffect(() => {
        if (isOpen && !prevOpen.current) {
          setForm({ name: '', address: '', lat: null, lng: null, mandates: [], orientation: [], isContest: false });
          if (addressInputRef.current) addressInputRef.current.value = '';
          autocompleteRef.current = null;
          setTimeout(() => nameInputRef.current?.focus(), 500);
        }
        prevOpen.current = isOpen;
      }, [isOpen]);

      // Init Google Places
      useEffect(() => {
        if (isOpen && addressInputRef.current && !autocompleteRef.current && window.google) {
          autocompleteRef.current = new google.maps.places.Autocomplete(addressInputRef.current, {
            types: ['establishment', 'geocode'],
            componentRestrictions: { country: 'ca' },
            fields: ['formatted_address', 'geometry', 'name']
          });
          autocompleteRef.current.addListener('place_changed', () => {
            const place = autocompleteRef.current.getPlace();
            if (place.geometry) {
              setForm(f => ({ ...f, address: place.formatted_address, lat: place.geometry.location.lat(), lng: place.geometry.location.lng() }));
            }
          });
        }
      }, [isOpen]);

      const handleSubmit = async () => {
        if (!form.name.trim()) return;
        setLoading(true);
        let data = { ...form };
        if (form.address && !form.lat) {
          try { const result = await geocodeAddress(form.address); data.lat = result.lat; data.lng = result.lng; data.address = result.formattedAddress; } catch (err) { console.warn('Geocoding error:', err); }
        }
        if (data.lat && data.lng && prefs.homeLat && prefs.homeLng) {
          try { const travel = await getTravelTime(prefs.homeLat, prefs.homeLng, data.lat, data.lng); data.travelTime = travel; data.departureAddress = prefs.homeAddress; data.departureLat = prefs.homeLat; data.departureLng = prefs.homeLng; } catch (err) { console.warn('Travel time error:', err); }
        }
        addProject(data);
        setLoading(false);
        onCreated();
      };

      const inputStyle = { background: 'transparent', border: '1px solid rgba(255,255,255,0.15)', padding: '12px 14px', color: 'rgba(255,255,255,0.85)', width: '100%', outline: 'none', fontSize: '16px', borderRadius: '8px' };

      return (
        <div style={{
          position: 'fixed', top: 0, right: 0, bottom: 0, width: '100%',
          background: '#1e2224',
          zIndex: 50,
          transform: isOpen ? 'translateX(0)' : 'translateX(100%)',
          transition: 'transform 0.4s cubic-bezier(0.32, 0.72, 0, 1)',
          overflowY: 'auto',
          WebkitOverflowScrolling: 'touch',
          paddingTop: 'calc(env(safe-area-inset-top, 0px) + 16px)',
          paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 100px)',
          paddingLeft: '20px',
          paddingRight: '20px'
        }}>
          {/* Back button */}
          <button onClick={onClose} style={{ 
            background: 'none', border: 'none', color: 'rgba(255,255,255,0.5)', 
            fontSize: '16px', padding: '8px 0', marginBottom: '24px', cursor: 'pointer',
            display: 'flex', alignItems: 'center', gap: '6px'
          }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span className="font-bebas-book" style={{ fontSize: '18px', letterSpacing: '0.05em' }}>RETOUR</span>
          </button>

          <h2 className="font-bebas-bold" style={{ fontSize: '28px', color: 'rgba(255,255,255,0.85)', marginBottom: '32px' }}>NOUVEAU PROJET</h2>

          <div style={{ marginBottom: '24px' }}>
            <label className="newproj-label font-bebas-book">NOM DU PROJET</label>
            <input ref={nameInputRef} type="text" autoComplete="one-time-code" value={form.name} onChange={e => setForm({...form, name: e.target.value.toUpperCase()})} onKeyDown={e => e.key === 'Enter' && handleSubmit()} placeholder="Client — Nom du projet" style={inputStyle}/>
          </div>

          <div style={{ marginBottom: '24px' }}>
            <label className="newproj-label font-bebas-book">ADRESSE DU PROJET</label>
            <input ref={addressInputRef} type="text" autoComplete="one-time-code" defaultValue={form.address} placeholder="Entrer l'adresse..." style={inputStyle}/>
          </div>

          <div style={{ marginBottom: '24px' }}>
            <label className="newproj-label font-bebas-book">MANDAT</label>
            <div className="flex gap-3 flex-wrap">
              {Object.values(MandateType).map(m => (
                <button key={m} type="button" onClick={() => setForm({...form, mandates: toggleMandate(form.mandates, m)})} className={`newproj-toggle font-bebas-bold ${form.mandates.includes(m) ? 'active' : ''}`} style={form.mandates.includes(m) && m === 'DRONE+C' ? { color: '#d83152' } : {}}>{m === 'DRONE+C' ? 'DRONE.C' : m}</button>
              ))}
            </div>
          </div>

          <div style={{ marginBottom: '32px' }}>
            <label className="newproj-label font-bebas-book">ORIENTATION</label>
            <div className="flex gap-3">
              {['AM','PM'].map(o => (
                <button key={o} type="button" onClick={() => setForm({...form, orientation: form.orientation.includes(o) ? form.orientation.filter(x => x !== o) : [...form.orientation, o]})} className={`newproj-toggle font-bebas-bold ${form.orientation.includes(o) ? 'active' : ''}`}>{o}</button>
              ))}
            </div>
          </div>

          <button onClick={handleSubmit} disabled={loading || !form.name.trim()} style={{
            width: '100%', padding: '14px', borderRadius: '10px',
            background: !form.name.trim() ? 'rgba(255,255,255,0.05)' : 'rgba(216,49,82,0.8)',
            color: !form.name.trim() ? 'rgba(255,255,255,0.2)' : '#fff',
            border: 'none', fontSize: '17px', cursor: 'pointer',
            fontFamily: "'Bebas Neue', sans-serif", letterSpacing: '0.05em',
            transition: 'background 0.2s, color 0.2s'
          }}>{loading ? 'CRÉATION...' : 'AJOUTER LE PROJET'}</button>
        </div>
      );
    };

    const App = () => {
      const { view, setView, selectedId, setSelectedId, prefs } = useStore();
      const [showNew, setShowNew] = useState(false);
      const plusRef = React.useRef(null);
      const [plusRect, setPlusRect] = useState(null);
      const isMobile = useIsMobile();
      const [displayedProjectId, setDisplayedProjectId] = useState(null);

      // Pull-to-refresh (Safari-style)
      useEffect(() => {
        if (!isMobile) return;
        let startY = 0, pulling = false, ready = false, indicator = null;
        const threshold = 140;
        const createIndicator = () => {
          if (indicator) return;
          indicator = document.createElement('div');
          indicator.style.cssText = 'position:fixed;top:80px;left:50%;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:9999;opacity:0;transition:opacity 0.2s;pointer-events:none;transform:translateX(-50%)';
          indicator.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(125,211,198,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.5s"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>';
          document.body.appendChild(indicator);
        };
        const removeIndicator = () => {
          if (indicator) { indicator.remove(); indicator = null; }
        };
        const onStart = (e) => {
          if (window.scrollY <= 0) {
            startY = e.touches[0].clientY;
            pulling = true;
            ready = false;
          }
        };
        const onMove = (e) => {
          if (!pulling) return;
          const dy = e.touches[0].clientY - startY;
          if (dy < 0) { pulling = false; removeIndicator(); return; }
          if (dy > 20) {
            createIndicator();
            const progress = Math.min(dy / threshold, 1);
            indicator.style.opacity = progress;
            const svg = indicator.querySelector('svg');
            if (svg) svg.style.transform = `rotate(${progress * 540}deg)`;
            ready = progress >= 1;
            if (ready) {
              indicator.style.background = 'rgba(125,211,198,0.15)';
              indicator.style.boxShadow = '0 0 12px rgba(125,211,198,0.3)';
            } else {
              indicator.style.background = 'rgba(0,0,0,0.3)';
              indicator.style.boxShadow = 'none';
            }
          }
        };
        const onEnd = () => {
          if (ready) {
            if (indicator) {
              indicator.style.transition = 'opacity 0.4s';
              indicator.style.opacity = '0';
            }
            setTimeout(() => window.location.reload(), 500);
          } else {
            if (indicator) {
              indicator.style.transition = 'opacity 0.2s';
              indicator.style.opacity = '0';
              setTimeout(() => removeIndicator(), 250);
            }
          }
          pulling = false;
          ready = false;
        };
        window.addEventListener('touchstart', onStart, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onEnd, { passive: true });
        return () => {
          window.removeEventListener('touchstart', onStart);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onEnd);
          removeIndicator();
        };
      }, [isMobile]);
      
      // Keep detail mounted during slide-out animation
      useEffect(() => {
        if (selectedId) {
          setDisplayedProjectId(selectedId);
        } else {
          const timer = setTimeout(() => setDisplayedProjectId(null), 600);
          return () => clearTimeout(timer);
        }
      }, [selectedId]);

      // Track plus button position
      useEffect(() => {
        const update = () => {
          if (plusRef.current) {
            const r = plusRef.current.getBoundingClientRect();
            setPlusRect({ x: r.left, y: r.top, w: r.width, h: r.height, cx: r.left + r.width/2, cy: r.top + r.height/2 });
          }
        };
        update();
        // Recalculate after fonts/content load
        const t1 = setTimeout(update, 100);
        const t2 = setTimeout(update, 500);
        const t3 = setTimeout(update, 1500);
        window.addEventListener('resize', update);
        window.addEventListener('scroll', update);
        document.fonts?.ready?.then(update);
        return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); window.removeEventListener('resize', update); window.removeEventListener('scroll', update); };
      }, [view]);

      // Browser history management
      const openProject = (p) => {
        setShowNew(false);
        setSelectedId(p.id);
        history.pushState({ projectId: p.id, view }, '', `#project/${p.id}`);
      };
      
      const closeProject = () => {
        setSelectedId(null);
        history.pushState({ view }, '', `#${view}`);
      };

      const changeView = (v) => {
        setView(v);
        setSelectedId(null);
        history.pushState({ view: v }, '', `#${v}`);
      };

      useEffect(() => {
        // Set initial state
        history.replaceState({ view }, '', `#${view}`);
        
        const onPopState = (e) => {
          const state = e.state;
          if (state?.projectId) {
            setSelectedId(state.projectId);
            if (state.view) setView(state.view);
          } else {
            setSelectedId(null);
            if (state?.view) setView(state.view);
          }
        };
        window.addEventListener('popstate', onPopState);
        return () => window.removeEventListener('popstate', onPopState);
      }, []);

      // Logo fade when overlapping content
      useEffect(() => {
        // Track mouse direction for day-popup slide
        let lastMouseX = 0;
        let hideTimeout = null;
        const handleMouseMove = (e) => { lastMouseX = e.clientX; };
        const handleMouseEnter = (e) => {
          if (hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null; }
          const cell = e.currentTarget;
          const rect = cell.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const dir = lastMouseX < centerX ? -8 : 8;
          // Hide all other popups instantly
          document.querySelectorAll('.day-popup.popup-active').forEach(p => {
            p.style.transition = 'none';
            p.classList.remove('popup-active');
          });
          const popup = cell.querySelector('.day-popup');
          if (popup) {
            popup.style.setProperty('--slide-from', dir + 'px');
            // Force reflow then animate in
            void popup.offsetWidth;
            popup.style.transition = '';
            popup.classList.add('popup-active');
          }
        };
        const handleMouseLeave = (e) => {
          hideTimeout = setTimeout(() => {
            document.querySelectorAll('.day-popup.popup-active').forEach(p => {
              p.style.transition = '';
              p.classList.remove('popup-active');
            });
          }, 80);
        };
        document.addEventListener('mousemove', handleMouseMove);
        // Touch support for day popups (desktop touch only, disabled on mobile <768px)
        const handleTouch = (e) => {
          if (window.innerWidth <= 768) return; // Skip on mobile
          const cell = e.target.closest('.day-cell');
          if (!cell) {
            // Tap outside: close all popups
            document.querySelectorAll('.day-popup.popup-active').forEach(p => {
              p.style.transition = '';
              p.classList.remove('popup-active');
            });
            return;
          }
          e.preventDefault();
          const popup = cell.querySelector('.day-popup');
          if (!popup) return;
          const wasActive = popup.classList.contains('popup-active');
          // Close all
          document.querySelectorAll('.day-popup.popup-active').forEach(p => {
            p.style.transition = 'none';
            p.classList.remove('popup-active');
          });
          // Toggle the tapped one
          if (!wasActive) {
            popup.style.setProperty('--slide-from', '0px');
            void popup.offsetWidth;
            popup.style.transition = '';
            popup.classList.add('popup-active');
          }
        };
        document.addEventListener('touchstart', handleTouch, { passive: false });
        // Disable CSS hover during scroll
        let scrollTimer;
        const onWheel = () => {
          document.body.classList.add('is-scrolling');
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => document.body.classList.remove('is-scrolling'), 150);
        };
        window.addEventListener('wheel', onWheel, { passive: true });
        const attach = () => {
          document.querySelectorAll('.day-cell').forEach(c => {
            c.removeEventListener('mouseenter', handleMouseEnter);
            c.addEventListener('mouseenter', handleMouseEnter);
            c.removeEventListener('mouseleave', handleMouseLeave);
            c.addEventListener('mouseleave', handleMouseLeave);
          });
        };
        attach();
        const obs = new MutationObserver(attach);
        obs.observe(document.body, { childList: true, subtree: true });
        return () => { document.removeEventListener('mousemove', handleMouseMove); document.removeEventListener('touchstart', handleTouch); obs.disconnect(); };
      });

      return (
        <div className="min-h-screen bg-cream" style={{ position: 'relative', overflow: 'hidden' }}>
          {/* Mobile top blur overlay for standalone mode */}
          {isMobile && <div id="top-blur-overlay" style={{ 
            position: 'fixed', top: 0, left: 0, right: 0, 
            height: 'calc(env(safe-area-inset-top, 0px) + 36px)',
            background: 'transparent',
            backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)',
            WebkitMaskImage: 'linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%)',
            maskImage: 'linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%)',
            zIndex: 40, pointerEvents: 'none',
            willChange: 'backdrop-filter'
          }}/>}
          {/* Soft radial gradient background - dark mode only */}
          <div style={{ position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none', background: `radial-gradient(ellipse 60% 40% at ${plusRect ? plusRect.cx : window.innerWidth * 0.5}px ${plusRect && !selectedId ? plusRect.cy : 120}px, rgba(45,80,70,0.35) 0%, rgba(44,44,44,0) 70%)` }}/>
          <div style={{ position: 'fixed', bottom: '80px', left: '12px', fontSize: '16px', color: 'rgba(255,255,255,0.5)', fontFamily: 'monospace', zIndex: 999, background: 'rgba(0,0,0,0.5)', padding: '3px 10px', borderRadius: '4px', pointerEvents: 'none' }}>v260</div>
          {!(isMobile && showNew) && <Header onChangeView={changeView} onAddProject={() => setShowNew(true)}/>}
          <div style={{ 
            display: isMobile && showNew ? 'none' : 'block',
            minHeight: '100vh'
          }}>
          <main className="animate-fade-in" style={{ position: 'relative', zIndex: 1, overflow: 'hidden' }}>
            <div style={{
              transform: selectedId ? 'translateX(-30%)' : 'translateX(0)',
              opacity: selectedId ? 0 : 1,
              transition: 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease',
              pointerEvents: selectedId ? 'none' : 'auto',
              position: selectedId || displayedProjectId ? 'absolute' : 'relative',
              width: '100%'
            }}>
              {view === 'todo' && <TodoView onSelect={openProject} onAddProject={() => setShowNew(true)} addingProject={showNew} plusRef={plusRef}/>}
              {view === 'retouching' && <RetouchingView onSelect={openProject}/>}
              {view === 'preferences' && <PreferencesView/>}
            </div>
            <div style={{
              transform: selectedId ? 'translateX(0)' : 'translateX(100%)',
              opacity: selectedId ? 1 : 0,
              transition: 'transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease',
              pointerEvents: selectedId ? 'auto' : 'none'
            }}>
              {displayedProjectId && <ProjectDetail projectId={displayedProjectId} onClose={closeProject}/>}
            </div>
          </main>
          </div>
          {/* Mobile slide-in new project screen */}
          {isMobile && <MobileNewProjectScreen isOpen={showNew} onClose={() => setShowNew(false)} onCreated={() => setShowNew(false)} />}
          {/* Desktop modal */}
          {!isMobile && view === 'todo' && !selectedId && plusRect && <NewProjectModal isOpen={showNew} origin={plusRect} onClose={() => { setShowNew(false); }} onCreated={() => { setShowNew(false); }} onOpen={() => setShowNew(true)}/>}
        </div>
      );
    };

    const AppWithAuth = () => {
      const { user, loading } = useAuth();
      
      if (loading) return (
        <div className="min-h-screen flex items-center justify-center" style={{ background: '#262c30' }}>
          <p className="font-bebas-bold" style={{ fontSize: '32px', color: '#8B9B99' }}>MeteoShoot</p>
        </div>
      );
      
      if (!user) return <LoginScreen/>;
      
      return <StoreProvider><App/></StoreProvider>;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthProvider><AppWithAuth/></AuthProvider>);
  </script>
</body>
</html>
