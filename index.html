<script>
  // Le splash se retire dès que l'interface est affichée (signal envoyé par l'application, voir App.jsx),
  // avec un filet de sécurité à 5 s. Le halo (flare) est conservé hors du splash pour l'effet de la liste.
  (function () {
    var done = false;
    function hideSplash() {
      if (done) return;
      done = true;
      var splash = document.getElementById('splashScreen');
      if (!splash) return;
      var flare = document.querySelector('.splash-flare');
      if (flare) {
        flare.id = 'persistentFlare';
        var rect = flare.getBoundingClientRect();
        flare.dataset.splashWidth = rect.width + 'px';
        flare.style.position = 'fixed';
        flare.style.zIndex = '30';
        flare.style.pointerEvents = 'none';
        flare.style.mixBlendMode = 'color-dodge';
        flare.style.opacity = '0';
        flare.style.width = rect.width + 'px';
        flare.style.transform = 'none';
        flare.style.animation = 'none';
        flare.style.transition = 'opacity 1s ease';
        document.body.appendChild(flare);
      }
      splash.classList.add('splash-hidden');
      document.getElementById('themeColor').setAttribute('content', '#181b1e');
      setTimeout(function() { splash.remove(); }, 1000);
      var mist = document.getElementById('msMist');
      if (mist) { mist.classList.add('lifted'); setTimeout(function() { mist.remove(); }, 1800); }
    }
    window.__meteoshootReady = hideSplash;
    setTimeout(hideSplash, 5000);
  })();
</script>
<script>
  // Drag-to-scroll with momentum, bounce & motion blur for .hour-scroll containers
  document.addEventListener('mousedown', function(e) {
    const el = e.target.closest('.hour-scroll');
    if (!el) return;
    let startX = e.pageX, scrollLeft = el.scrollLeft, moved = false;
    let lastX = e.pageX, lastT = Date.now(), velocity = 0;
    let rafId = null;
    el.classList.add('dragging');
    el.style.scrollBehavior = 'auto';

    const onMove = (ev) => {
      const dx = ev.pageX - startX;
      if (Math.abs(dx) > 3) moved = true;
      const now = Date.now();
      const dt = now - lastT;
      if (dt > 0) velocity = (ev.pageX - lastX) / dt;
      lastX = ev.pageX; lastT = now;
      el.scrollLeft = scrollLeft - dx;
    };

    const onUp = () => {
      el.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      let v = velocity * 16;
      const decel = 0.95;
      const maxScroll = el.scrollWidth - el.clientWidth;

      const glide = () => {
        if (Math.abs(v) < 0.5) { doBounce(); return; }
        const before = el.scrollLeft;
        el.scrollLeft -= v;
        const after = el.scrollLeft;
        if (before === after && Math.abs(v) > 2) { doBounce(); return; }
        v *= decel;
        rafId = requestAnimationFrame(glide);
      };

      const doBounce = () => {
        const atStart = el.scrollLeft <= 0;
        const atEnd = el.scrollLeft >= maxScroll - 1;
        if ((atStart || atEnd) && Math.abs(velocity) > 0.1) {
          const dir = atStart ? 1 : -1;
          const bump = Math.min(Math.abs(velocity) * 80, 30);
          el.style.transition = 'transform 0.15s cubic-bezier(0.2, 0, 0.4, 1)';
          el.style.transform = 'translateX(' + (dir * bump) + 'px)';
          setTimeout(() => {
            el.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
            el.style.transform = '';
            setTimeout(() => { el.style.transition = ''; }, 500);
          }, 150);
        }
      };

      glide();
      const stopMomentum = () => {
        if (rafId) cancelAnimationFrame(rafId);
        el.removeEventListener('mousedown', stopMomentum);
      };
      el.addEventListener('mousedown', stopMomentum, { once: true });
      if (moved) {
        const block = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
        el.addEventListener('click', block, { capture: true, once: true });
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
</script>
