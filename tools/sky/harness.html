<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc du ciel (vue 3D)</title>
<style>html,body{margin:0;height:100%;background:#111;overflow:hidden}#box{position:absolute;inset:0}</style>
</head>
<body>
<div id="box"></div>
<script>var isNativeApp = false; var isDev = true;</script>
<script type="module">
// Banc d'essai du ciel de la vue 3D: le moteur seul (pas l'application), piloté par window.H depuis un script CDP
// (tools/sky/shoot.mjs). Servi par le serveur de développement Vite: http://localhost:5173/tools/sky/harness.html
import { createScene3D } from '/src/scene3d/engine.js';
import { loadScene } from '/src/scene3d/data.js';
import { loadTerrain } from '/src/scene3d/terrain.js';
import SunCalc from 'suncalc';
import { CLOUD_GLSL, classifyClouds } from '/src/scene3d/sky.js';
import { fetchWeather } from '/src/weather/api.js';
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const lat = Number(q.get('lat') || 47.01031), lng = Number(q.get('lng') || -71.37338);
// Maison du projet de Stéphane (Stoneham) par défaut: rectangle de 14 x 10 m, 7 m de haut, enduit blanc.
const m = 1 / 111320, mL = m / Math.cos(lat * Math.PI / 180);
const rect = (cx, cy, w, d) => [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(([x, n]) => ({ lat: cy + n * m, lng: cx + x * mL }));
const buildings = q.get('nobld') ? [] : [{ polygon: rect(lng, lat, 14, 10), height: Number(q.get('h') || 7), name: 'Maison', wallColor: '#e8e4dc' }];

const box = document.getElementById('box');
const log = [];
const e = createScene3D(box, { onInfo: (i) => { window.H.info = i; } });
window.__scene3d = e;
e.setProject({ lat, lng, buildings, orientation: ['PM'] });
const status = { terrain: 'en cours', scene: 'en cours' };
const ready = Promise.all([
  q.get('flat') ? Promise.resolve() : loadTerrain(lat, lng).then(t => { e.setTerrain(t); status.terrain = 'ok'; }).catch(err => { status.terrain = 'erreur: ' + err.message; }),
  q.get('noscene') ? Promise.resolve() : loadScene(lat, lng).then(d => { e.setData(d); status.scene = 'ok (' + (d.bld || []).length + ' bâtiments)'; }).catch(err => { status.scene = 'erreur: ' + err.message; }),
]).then(() => status);

// Heure: millisecondes, texte local « 2026-10-09T15:00 », ou relatif au soleil { rel: 'sunset' | 'sunrise' | 'noon', min, date }.
function timeOf(spec) {
  if (typeof spec === 'number') return spec;
  if (typeof spec === 'string') return new Date(spec).getTime();
  const base = spec.date ? new Date(spec.date) : new Date(); base.setHours(12, 0, 0, 0);
  const t = SunCalc.getTimes(base, lat, lng);
  const ref = spec.rel === 'sunrise' ? t.sunrise : spec.rel === 'noon' ? t.solarNoon : t.sunset;
  return ref.getTime() + (spec.min || 0) * 60000;
}
const localIso = (ms) => { const d = new Date(ms); const p = (v) => String(v).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:00`; };

let curMs = Date.now();
window.H = {
  e, ready, status, info: null,
  timeOf,
  set(spec) {
    if (spec.time != null) { curMs = timeOf(spec.time); e.setTime(curMs); }
    if (spec.view) {
      const v = { ...spec.view };
      // towardSun: caméra placée pour regarder vers le soleil (az = azimut SunCalc, mesuré depuis le sud); false: dos au soleil.
      if (v.towardSun !== undefined) { const azS = SunCalc.getPosition(new Date(curMs), lat, lng).azimuth; v.az = v.towardSun ? azS : azS + Math.PI; delete v.towardSun; }
      e.setView(v);
    }
    if (spec.weather !== undefined) {
      const w = spec.weather;
      if (w == null) e.setWeather(null);
      else {
        // Rangée horaire comme celle de l'application (src/weather/api.js), complétée par défaut.
        const sf = w.sunFraction ?? (1 - (w.cloudLow ?? 0) / 100 * 0.9);
        const row = { time: localIso(curMs), temp: 12, wind: 10, gust: 15, cloudcover: Math.max(w.cloudLow ?? 0, w.cloudMid ?? 0, w.cloudHigh ?? 0), precip: 0, precipProb: 0, sunFraction: sf, cloudLow: 0, cloudMid: 0, cloudHigh: 0, visibility: 20000, fogThick: null, smoke: 0, icon: 'cloudy', isGood: true, wc: 2, direct: null, convBase: 0, convDepth: 0, prev: [], ...w };
        if (row.direct == null) { const h = SunCalc.getPosition(new Date(curMs - 1800000), lat, lng).altitude * 180 / Math.PI; row.direct = h > 0 ? Math.max(0, (950 - 710 * Math.exp(-h / 20.2)) * Math.sin(h * Math.PI / 180) * (w.pSun ?? sf)) : 0; }
        e.setWeather(row);
      }
    }
    if (spec.smoke !== undefined) e.setSmoke(spec.smoke);
  },
  // Capture du canevas (le tampon n'est pas gardé entre les images): on force une image, puis on attend celle que le moteur
  // redessine seul avec les nuages en pleine résolution (220 ms après l'arrêt), sinon la première image après 1,5 s.
  capture(ms = 0, anyFrame = false) {
    return new Promise((res) => {
      setTimeout(() => {
        const core = window.__scene3dCore, t0 = performance.now();
        core.afterFrame = (w, h, hi) => { if (hi || anyFrame || performance.now() - t0 > 1500) { core.afterFrame = null; res(core.R.domElement.toDataURL('image/png')); } };
        e.setView({}); // force une image (réduite), la pleine résolution suit d'elle-même
      }, ms);
    });
  },
  // Statistiques des cibles de rendu (min, max, NaN) pour diagnostiquer une explosion de valeurs.
  stats() {
    const core = window.__scene3dCore, R = core.R, rts = core.sky.rts(), out = {};
    const h2f = (h) => { const sg = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff; if (e === 0) return sg * Math.pow(2, -14) * (f / 1024); if (e === 31) return f ? NaN : sg * Infinity; return sg * Math.pow(2, e - 15) * (1 + f / 1024); };
    const scan = (name, rt, face) => { const w = rt.width, h = rt.height, half = rt.texture.type === core.THREE.HalfFloatType, buf = half ? new Uint16Array(w * h * 4) : new Uint8Array(w * h * 4); R.readRenderTargetPixels(rt, 0, 0, w, h, buf, face); let mn = Infinity, mx = -Infinity, nan = 0, inf = 0, sum = 0; const ch = [0, 0, 0]; for (let i = 0; i < buf.length; i++) { const v = half ? h2f(buf[i]) : buf[i] / 255; if (v !== v) nan++; else if (!isFinite(v)) inf++; else { if (v < mn) mn = v; if (v > mx) mx = v; sum += v; if (i % 4 < 3) ch[i % 4] += v; } } const n = buf.length / 4; out[name] = { w, h, mn: +mn.toFixed(4), mx: +mx.toFixed(3), nan, inf, mean: +(sum / (buf.length - nan - inf)).toFixed(4), rgb: ch.map(v => +(v / n).toFixed(4)) }; };
    try { scan('cloud', rts.cloudRT); } catch (e) { out.cloud = String(e); }
    try { for (let f = 0; f < 6; f++) scan('cube' + f, rts.cubeRT, f); } catch (e) { out.cube = String(e); }
    try { scan('scene', rts.sceneRT); } catch (e) { out.scene = String(e); }
    try { if (rts.envRT) scan('env', rts.envRT); } catch (e) { out.env = String(e); }
    return out;
  },
  // Sonde: évalue clouds() (code GLSL de sky.js, mêmes uniformes que le moteur) dans n directions réparties sur la sphère,
  // avec un corps de shader au choix (expr: expression GLSL vec4 à sortir; par défaut le résultat de clouds). Renvoie les pires valeurs.
  probe(n = 1500, expr = null, jit = 0.5, quality = 0.5) {
    const core = window.__scene3dCore, R = core.R, U = core.sky.cloudU;
    const frag = CLOUD_GLSL + `
uniform vec3 uDir; uniform float uJit, uQual; void main(){ vec3 rd = normalize(uDir); gl_FragColor = ${expr || 'clouds(uCamW, rd, uJit, uQual)'}; }`;
    const mat = new THREE.ShaderMaterial({ uniforms: { ...U, uDir: { value: new THREE.Vector3(0, 1, 0) }, uJit: { value: jit }, uQual: { value: quality } }, vertexShader: 'void main(){gl_Position=vec4(position.xy,0.0,1.0);}', fragmentShader: frag });
    const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.FloatType, depthBuffer: false });
    const sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    const buf = new Float32Array(4), out = []; const prev = R.getRenderTarget();
    for (let i = 0; i < n; i++) { const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), a = i * 2.39996; mat.uniforms.uDir.value.set(r * Math.cos(a), y, r * Math.sin(a)); R.setRenderTarget(rt); R.render(sc, cam); R.readRenderTargetPixels(rt, 0, 0, 1, 1, buf); out.push({ d: [+(r * Math.cos(a)).toFixed(4), +y.toFixed(4), +(r * Math.sin(a)).toFixed(4)], v: Array.from(buf).map(v => +v.toFixed(4)) }); }
    R.setRenderTarget(prev); rt.dispose(); mat.dispose();
    const bad = out.filter(o => o.v.some(v => !(v >= 0) || v > 1000)); bad.sort((a, b) => Math.min(...a.v) - Math.min(...b.v));
    return { n, bad: bad.length, worst: bad.slice(0, 8), sample: out.filter((o, i) => i % Math.ceil(n / 6) === 0) };
  },
  // Texels négatifs ou aberrants de la carte cubique d'ambiance (face, colonne, rangée, valeurs) et directions candidates.
  cubeBad() {
    const core = window.__scene3dCore, R = core.R, rt = core.sky.rts().cubeRT, N = rt.width, out = [];
    const h2f = (h) => { const sg = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff; if (e === 0) return sg * Math.pow(2, -14) * (f / 1024); if (e === 31) return f ? NaN : sg * Infinity; return sg * Math.pow(2, e - 15) * (1 + f / 1024); };
    const dirOf = (f, s, t) => [[1, -t, -s], [-1, -t, s], [s, 1, t], [s, -1, -t], [s, -t, 1], [-s, -t, -1]][f];
    for (let f = 0; f < 6; f++) { const buf = new Uint16Array(N * N * 4); R.readRenderTargetPixels(rt, 0, 0, N, N, buf, f);
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const v = [0, 1, 2, 3].map(c => h2f(buf[(j * N + i) * 4 + c])); if (v.some(x => !(x >= 0) || x > 1000)) out.push({ f, i, j, v: v.map(x => +x.toFixed(2)), d: dirOf(f, (i + 0.5) / N * 2 - 1, (j + 0.5) / N * 2 - 1) }); } }
    return { n: out.length, list: out.slice(0, 12) };
  },
  // Évalue une expression GLSL (vec4) dans une direction donnée.
  probeDir(d, expr = null, jit = 0.5, quality = 0.5) {
    const core = window.__scene3dCore, R = core.R, U = core.sky.cloudU;
    const frag = CLOUD_GLSL + `\nuniform vec3 uDir; uniform float uJit, uQual; void main(){ vec3 rd = normalize(uDir); gl_FragColor = ${expr || 'clouds(uCamW, rd, uJit, uQual)'}; }`;
    const mat = new THREE.ShaderMaterial({ uniforms: { ...U, uDir: { value: new THREE.Vector3().fromArray(d) }, uJit: { value: jit }, uQual: { value: quality } }, vertexShader: 'void main(){gl_Position=vec4(position.xy,0.0,1.0);}', fragmentShader: frag });
    const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.FloatType, depthBuffer: false }), sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    const prev = R.getRenderTarget(); R.setRenderTarget(rt); R.render(sc, cam); const buf = new Float32Array(4); R.readRenderTargetPixels(rt, 0, 0, 1, 1, buf); R.setRenderTarget(prev); rt.dispose(); mat.dispose();
    return Array.from(buf).map(v => +v.toFixed(5));
  },
  // Couverture apparente d'une couche basse: part du ciel (directions d'élévation >= ymin) couverte, pour des réglages
  // donnés (cov, typ, tower, cb): moyenne de 1 - T et part des directions presque opaques (T < 0,3).
  coverage(cases, n = 900, ymin = 0.3) {
    const core = window.__scene3dCore, R = core.R, U = core.sky.cloudU, g = U.uGround.value;
    const keep = { l0: U.uLay0.value.clone(), l0b: U.uLay0b.value.clone(), l1: U.uLay1.value.clone(), hi: U.uHi.value.clone(), sh: U.uShaft.value };
    const frag = CLOUD_GLSL + `\nuniform vec3 uDir; void main(){ gl_FragColor = clouds(uCamW, normalize(uDir), 0.5, 1.0); }`;
    const mat = new THREE.ShaderMaterial({ uniforms: { ...U, uDir: { value: new THREE.Vector3(0, 1, 0) } }, vertexShader: 'void main(){gl_Position=vec4(position.xy,0.0,1.0);}', fragmentShader: frag });
    const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.FloatType, depthBuffer: false }), sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    const buf = new Float32Array(4), prev = R.getRenderTarget(), out = [];
    U.uLay1.value.z = 0; U.uHi.value.x = 0; U.uShaft.value = 0;
    for (const c of cases) {
      U.uLay0.value.set(g + (c.base ?? 1000), g + (c.top ?? 2000), c.cov, c.typ ?? 1); U.uLay0b.value.set(c.tower ?? 0, c.cb ?? 0, 0, 0);
      let s1 = 0, op = 0, lum = 0;
      for (let i = 0; i < n; i++) { const y = ymin + (1 - ymin) * (i + 0.5) / n, r = Math.sqrt(1 - y * y), a = i * 2.39996; mat.uniforms.uDir.value.set(r * Math.cos(a), y, r * Math.sin(a)); R.setRenderTarget(rt); R.render(sc, cam); R.readRenderTargetPixels(rt, 0, 0, 1, 1, buf); s1 += 1 - buf[3]; if (buf[3] < 0.3) op++; lum += 0.2126 * buf[0] + 0.7152 * buf[1] + 0.0722 * buf[2]; }
      out.push({ ...c, frac: +(s1 / n).toFixed(3), opaque: +(op / n).toFixed(3), lum: +(lum / n).toFixed(4) });
    }
    R.setRenderTarget(prev); rt.dispose(); mat.dispose();
    U.uLay0.value.copy(keep.l0); U.uLay0b.value.copy(keep.l0b); U.uLay1.value.copy(keep.l1); U.uHi.value.copy(keep.hi); U.uShaft.value = keep.sh;
    return out;
  },
  // Sonde libre: corps GLSL complet (doit écrire gl_FragColor), avec rd = direction normalisée et les uniformes du moteur.
  probeBody(d, body) {
    const core = window.__scene3dCore, R = core.R, U = core.sky.cloudU;
    const frag = CLOUD_GLSL + `\nuniform vec3 uDir; void main(){ vec3 rd = normalize(uDir); ${body} }`;
    const mat = new THREE.ShaderMaterial({ uniforms: { ...U, uDir: { value: new THREE.Vector3().fromArray(d) } }, vertexShader: 'void main(){gl_Position=vec4(position.xy,0.0,1.0);}', fragmentShader: frag });
    const rt = new THREE.WebGLRenderTarget(1, 1, { type: THREE.FloatType, depthBuffer: false }), sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    const prev = R.getRenderTarget(); R.setRenderTarget(rt); R.render(sc, cam); const buf = new Float32Array(4); R.readRenderTargetPixels(rt, 0, 0, 1, 1, buf); R.setRenderTarget(prev); rt.dispose(); mat.dispose();
    return Array.from(buf).map(v => +v.toFixed(5));
  },
  // Temps de rendu: passe des nuages seule (n fois, attente de la carte graphique) et image complète (n images forcées).
  bench(n = 12) {
    const core = window.__scene3dCore, R = core.R, gl = R.getContext(), rts = core.sky.rts(), mat = core.sky.cloudPassMat;
    const sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
    const prev = R.getRenderTarget(); R.setRenderTarget(rts.cloudRT); R.render(sc, cam);
    // Synchronisation: lire un pixel force la carte graphique à finir (gl.finish ne bloque pas toujours sans fenêtre).
    const px = new Uint16Array(4); R.readRenderTargetPixels(rts.cloudRT, 0, 0, 1, 1, px);
    let t0 = performance.now(); for (let i = 0; i < n; i++) R.render(sc, cam); R.readRenderTargetPixels(rts.cloudRT, 0, 0, 1, 1, px); const cloudMs = (performance.now() - t0) / n; R.setRenderTarget(prev);
    return new Promise((res) => { let k = 0; const t1 = performance.now(); const tick = () => { core.afterFrame = null; if (++k >= n) { res({ cloudMs: +cloudMs.toFixed(2), frameMs: +((performance.now() - t1) / n).toFixed(2), w: rts.cloudRT.width, h: rts.cloudRT.height }); return; } core.afterFrame = tick; e.setView({ az: e.getView().az + 0.0005 }); }; core.afterFrame = tick; e.setView({ az: e.getView().az + 0.0005 }); });
  },
  // Prévision réelle (Open-Meteo, ICON puis GFS) du lieu du banc: rangées horaires complètes, avec les trois heures précédentes.
  async real() {
    const w = await fetchWeather(lat, lng); if (!w || !w.data) throw new Error('météo indisponible: ' + JSON.stringify(w && w.error));
    const H = w.data.hourly; return H.map((h, i) => ({ ...h, prev: [1, 2, 3].map(k => H[i - k] || null), cls: classifyClouds(h) }));
  },
  setRow(row) { curMs = new Date(row.time).getTime() + 1800000; e.setTime(curMs); e.setWeather(row); },
  dbg() { const core = window.__scene3dCore; const U = (core.skyU || {}); return { dbg: core.dbg || null, view: e.getView(), status, info: this.info, w: box.clientWidth, h: box.clientHeight, log: log.splice(0) }; },
};
console.log('[harness] prêt, lat', lat, 'lng', lng);
</script>
</body>
</html>
